function toggleCobro(propId,habId,igId){
  const p=propiedades.find(x=>x.id===propId);
  if(habId){
    const h=p.habitaciones.find(x=>x.id===habId);
    if(h){
      if(!h.cobrado){
        const f=prompt('¿Qué día se realizó el pago? (AAAA-MM-DD)',new Date().toISOString().slice(0,10));
        if(!f) return;
        h.cobrado=true;h.fechaCobro=f;h.mesCobro=mesCorrespondiente();
      } else {h.cobrado=false;h.fechaCobro=null;h.mesCobro=null;}
    }
  } else if(igId){
    const ig=(p.ingresos||[]).find(x=>x.id===igId);
    if(ig){
      if(!ig.cobrado){
        const f=prompt('¿Qué día se realizó el pago? (AAAA-MM-DD)',new Date().toISOString().slice(0,10));
        if(!f) return;
        ig.cobrado=true;ig.fechaCobro=f;ig.mesCobro=mesCorrespondiente();
      } else {ig.cobrado=false;ig.fechaCobro=null;ig.mesCobro=null;}
    }
  }
  saveData();
  if(currentSection==='detalle'){window._dTab='inquilinos';renderDetalle(document.getElementById('main-content'));}
  else verIngresos(propId);
}

function onCatChange(){
  const cat=document.getElementById('g-cat').value,esAnual=cat==='IBI'||cat==='Seguro';
  document.getElementById('g-anual-wrap').style.display=esAnual?'block':'none';
  document.getElementById('g-mensual-wrap').style.display=esAnual?'none':'block';
  if(esAnual)document.getElementById('g-anual-label').textContent=cat+' — importe anual total (€)';
}
function calcMensual(){document.getElementById('g-mensual-preview').textContent=fmtDec((parseFloat(document.getElementById('g-anual').value)||0)/12);}
function guardarGasto(propId){
  const p=propiedades.find(x=>x.id===propId);
  const cat=document.getElementById('g-cat').value,con=document.getElementById('g-con').value.trim();
  const esAnual=cat==='IBI'||cat==='Seguro';
  const importeAnual=esAnual?parseFloat(document.getElementById('g-anual').value)||0:0;
  const importe=esAnual?importeAnual/12:parseFloat(document.getElementById('g-imp').value)||0;
  if(!con||!importe){alert('Concepto e importe son obligatorios');return;}
  p.gastos=p.gastos||[];
  p.gastos.push({id:nextId++,categoria:cat,concepto:con,importe,importeAnual:esAnual?importeAnual:null,tipoAnual:esAnual,mes:parseInt(document.getElementById('g-mes').value)||1,anio:ANIO_ACTUAL,recurrente:document.getElementById('g-rec').checked});
  saveData();verGastos(propId);
}
function borrarGasto(propId,gId){
  const p=propiedades.find(x=>x.id===propId);
  p.gastos=p.gastos.filter(g=>g.id!==gId);
  saveData();
  if(currentSection==='detalle'){window._dTab='gastos';renderDetalle(document.getElementById('main-content'));}
  else{verGastos(propId);}
}

function guardarGastoFijo(propNombre,concepto){

  g.concepto=conEl.value.trim()||g.concepto;

  if(g.tipoAnual){g.importeAnual=v;g.importe=Math.round(v/12*100)/100;}
  else{g.importe=v;}
  const mesEl=document.getElementById('ge-mes-'+gId),anioEl=document.getElementById('ge-anio-'+gId),recEl=document.getElementById('ge-rec-'+gId);
  if(mesEl){const m=parseInt(mesEl.value);if(m>=1&&m<=12)g.mes=m;}

function guardarEditInquilino(propId,habId,igId){
  const p=propiedades.find(x=>x.id===propId);

  const key=propId+'-'+(habId||igId);
  const nom=document.getElementById('ei-nom-'+key).value.trim();
  const tel=document.getElementById('ei-tel-'+key).value.trim();
  const email=document.getElementById('ei-email-'+key).value.trim();
  const alq=parseFloat(document.getElementById('ei-alq-'+key).value)||0;
  const entrada=document.getElementById('ei-ent-'+key).value;
  const fin=document.getElementById('ei-fin-'+key).value;
  if(habId&&habId!=='null'){
    const h=p.habitaciones.find(x=>x.id===habId);

  } else if(igId&&igId!=='null'){

  }
  saveData();renderSection(currentSection);
}

function abrirModalIPC(propId,habId,igId,alquilerActual){
  showModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">📈 Aplicar subida IPC</div>
    <div style="background:#fff7ed;border-radius:8px;padding:0.7rem;margin-bottom:1rem;font-size:0.82rem;color:#9a3412;">Introduce el % de subida (p.ej. 2.5 para un 2,5%).</div>
    <div class="field"><label>Alquiler actual (€)</label><input id="ipc-actual" type="number" value="${alquilerActual}" readonly style="background:#f3f4f6;"/></div>
    <div class="field"><label>% IPC a aplicar</label><input id="ipc-pct" type="number" step="0.1" placeholder="Ej: 2.5" oninput="calcNuevoAlquiler()"/></div>
    <div class="field"><label>Nuevo alquiler (€)</label><input id="ipc-nuevo" type="number" placeholder="Se calcula automáticamente"/></div>

    </div>

function calcNuevoAlquiler(){
  const actual=parseFloat(document.getElementById('ipc-actual').value)||0;
  const pct=parseFloat(document.getElementById('ipc-pct').value)||0;
  document.getElementById('ipc-nuevo').value=(actual*(1+pct/100)).toFixed(2);
}
function aplicarIPC(propId,habId,igId){
  const nuevo=parseFloat(document.getElementById('ipc-nuevo').value)||0;
  if(!nuevo){alert('Introduce el % IPC');return;}
  const p=propiedades.find(x=>x.id===propId);
  if(habId){const h=p.habitaciones.find(x=>x.id===habId);if(h){h.alquilerAnterior=h.alquiler;h.alquiler=Math.round(nuevo);h.ipcAplicado=true;}}
  else if(igId){const ig=(p.ingresos||[]).find(x=>x.id===igId);if(ig){ig.importeAnterior=ig.importe;ig.importe=Math.round(nuevo);ig.ipcAplicado=true;}}
  closeModal();renderSection(currentSection);saveData();
}
function descartarIPC(propId,habId,igId){
  const p=propiedades.find(x=>x.id===propId);
  if(habId){const h=p.habitaciones.find(x=>x.id===habId);if(h)h.ipcAplicado=true;}
  else if(igId){const ig=(p.ingresos||[]).find(x=>x.id===igId);if(ig)ig.ipcAplicado=true;}
  renderSection(currentSection);saveData();
}
function descartarSeguroAlerta(propId,tipo){
  const p=propiedades.find(x=>x.id===propId);
  if(!p||!p.seguros||!p.seguros[tipo])return;
  p.seguros[tipo].alertaDescartada=true;
  renderSection(currentSection);saveData();
}

function aplicarFiltroAnio(){
  propiedades.forEach(p=>{

      const desDeMes=desdeAnio===_gAnio?1:(desdeAnio===ini.anio?ini.mes:1);

      const hastaMes=_gAnio===ANIO_ACTUAL?MES_ACTUAL:12;
      _gSeleccion[p.nombre].desde=desdeAnio+'-'+String(desDeMes).padStart(2,'0');

function setGestoriaDesde(nombre,val){if(_gSeleccion[nombre])_gSeleccion[nombre].desde=val;}
function setGestoriaHasta(nombre,val){if(_gSeleccion[nombre])_gSeleccion[nombre].hasta=val;}


// Gastos de un piso en el periodo de Gestoría, sacados del control de caja (mi parte), agrupados por concepto.
const CATS_SUMINISTRO=['Agua','Luz','Gas','Internet','Electricidad','Suministros'];
function catDeConcepto(p,concepto){
  const k=String(concepto||'').trim().toLowerCase();
  const g=(HISTORICO_GASTOS[p.nombre]||[]).concat(p.gastos||[]).find(x=>String(x.concepto||'').trim().toLowerCase()===k);
  if(g)return g.categoria||g.concepto;
  const s=CATS_SUMINISTRO.find(c=>k.startsWith(c.toLowerCase()));
  return s||concepto;
}
function mesesRango(desde,hasta){
  const [dy,dm]=desde.split('-').map(Number),[hy,hm]=hasta.split('-').map(Number),out=[];
  for(let y=dy;y<=hy;y++){const a=(y===dy?dm:1),b=(y===hy?hm:12);for(let m=a;m<=b;m++)out.push([y,m]);}
  return out;
}
function gestoriaGastosPropBase(p,sel,gatosSel){
  const porConcepto={};
  mesesRango(sel.desde,sel.hasta).forEach(([y,m])=>{
    const b=cajaMes(y,m).find(x=>x.key===String(p.id));if(!b)return;
    b.gas.forEach(l=>{
      const cat=catDeConcepto(p,l.c);
      if(gatosSel&&gatosSel[cat]===false)return;
      const k=String(l.c).trim();
      porConcepto[k]=porConcepto[k]||{concepto:k,cat,total:0,meses:0};
      porConcepto[k].total+=(+l.i||0);porConcepto[k].meses++;
    });
  });
  const gastosDetalle=Object.values(porConcepto).map(g=>({...g,total:Math.round(g.total*100)/100,importe:g.meses?g.total/g.meses:0}));
  return{gastosDetalle,gasTotal:gastosDetalle.reduce((a,g)=>a+g.total,0)};
}
// Ajustes para la gestoría (importe con factura) — no tocan la caja
function claveG(p,sel){return p.id+'|'+sel.desde+'|'+sel.hasta;}
function gestoriaGastosProp(p,sel,gatosSel){
  const base=gestoriaGastosPropBase(p,sel,gatosSel),aj=(_extra.gestoria||{})[claveG(p,sel)]||{};
  const inv=_extra.inversion[String(p.id)]||{},n=partesProp(p);
  const det=base.gastosDetalle.map(g=>{
    const hipo=RE_HIPO.test(g.concepto||''),o=aj.importes&&aj.importes[g.concepto];
    if(o!=null){const oo=r2(o*ratioDecl(p));return{...g,clave:g.concepto,concepto:hipo?'Intereses '+g.concepto+' (certificado)':g.concepto,original:g.total,total:oo,importe:g.meses?oo/g.meses:oo,ajustado:true,hipo};}
    if(hipo&&typeof fiscal==='function'){
      const fz=fiscal(p),[dy]=sel.desde.split('-').map(Number),[hy]=sel.hasta.split('-').map(Number);
      if(dy===hy&&fz.intereses&&fz.intereses[dy]!=null&&fz.intereses[dy]!=='')
        return{...g,clave:g.concepto,concepto:'Intereses '+g.concepto,original:g.total,total:r2(fz.intereses[dy]),importe:g.meses?r2(fz.intereses[dy])/g.meses:0,intereses:true,cert:true,hipo};
    }
    if(hipo&&tienePrestamo(inv)){
      let s=0;mesesRango(sel.desde,sel.hasta).forEach(([y,m])=>{const b=cajaMes(y,m).find(x=>x.key===String(p.id));if(b&&b.gas.some(l=>String(l.c).trim()===g.concepto))s+=interesMes(inv,y,m)*pctF(p)/100;});
      return{...g,clave:g.concepto,concepto:'Intereses '+g.concepto,original:g.total,total:r2(s),importe:g.meses?r2(s)/g.meses:r2(s),intereses:true,hipo};
    }
    return hipo?{...g,faltaPrestamo:true,hipo}:g;
  });

  if(p.tipo!=='gestion'){
    const am=amortizacion(p,sel),o=aj.importes&&aj.importes[AMORT];
    if(o!=null)det.push({concepto:AMORT,clave:AMORT,cat:'Amortización',total:r2(o*ratioDecl(p)),meses:1,importe:r2(o*ratioDecl(p)),ajustado:true,original:am?am.total:0,amort:true});
    else det.push({concepto:AMORT,clave:AMORT,cat:'Amortización',total:am?am.total:0,meses:1,importe:am?am.total:0,amort:true,faltaAmort:!am,am});

const AMORT='Amortización del inmueble (3%)';
function amortizacion(p,meses){

  if(!vcc||!vct||!coste)return null;
  const pc=Math.min(1,vcc/vct),costeConstr=coste*pc,base=Math.max(costeConstr,vcc),anual=base*0.03;
  return{coste,pc,costeConstr,vcc,base,anual,meses,total:r2(anual*meses/12/n),n};
}

function gestoriaCategoriasProp(p,sel){
  const cats=new Set();
  (HISTORICO_GASTOS[p.nombre]||[]).forEach(g=>cats.add(g.categoria||g.concepto));
  (p.gastos||[]).forEach(g=>cats.add(g.categoria||g.concepto));
  if(sel)mesesRango(sel.desde,sel.hasta).forEach(([y,m])=>{const b=cajaMes(y,m).find(x=>x.key===String(p.id));if(b)b.gas.forEach(l=>cats.add(catDeConcepto(p,l.c)));});
  return cats;
}

function gestoriaMesesPeriodo(desde,hasta){
  const [dy,dm]=desde.split('-').map(Number);
  const [hy,hm]=hasta.split('-').map(Number);
  return Math.max(0,(hy-dy)*12+(hm-dm)+1);
}

function gestoriaResumenRapido(propNombre,desde,hasta){
  const [dy,dm]=desde.split('-').map(Number);
  const [hy,hm]=hasta.split('-').map(Number);
  let total=0;
  for(let y=dy;y<=hy;y++){
    const mIni=(y===dy?dm:1), mFin=(y===hy?hm:12);
    for(let m=mIni;m<=mFin;m++){
      const pp=propiedades.find(x=>x.nombre===propNombre);
      if(pp) total+=ingresoMioMes(pp,y,m);
    }
  }
  return fmt(total)+'€ ingresos';
}

function buildGestoriaData(){
  const propsSel=propiedades.filter(p=>_gSeleccion[p.nombre]&&_gSeleccion[p.nombre].incluir);
  const rows=[];
  propsSel.forEach(p=>{
    const sel=_gSeleccion[p.nombre];
    const [dy,dm]=sel.desde.split('-').map(Number);
    const [hy,hm]=sel.hasta.split('-').map(Number);
    const gatosSel=_gGastosSel[p.nombre]||{};
    const meses=gestoriaMesesPeriodo(sel.desde,sel.hasta);
    let ingTotal=0;
    for(let y=dy;y<=hy;y++){
      const mIni=(y===dy?dm:1),mFin=(y===hy?hm:12);
      for(let m=mIni;m<=mFin;m++) ingTotal+=ingresoMioMes(p,y,m);
    }
    const {gastosDetalle,gasTotal}=gestoriaGastosProp(p,sel,gatosSel);
    rows.push({prop:p.nombre,desde:sel.desde,hasta:sel.hasta,meses,ingTotal,gasTotal,neto:ingTotal-gasTotal,gastos:gastosDetalle});
  });
  return rows;
}

function exportarGestoriaCSV(){
  const data=buildGestoriaData();
  let csv='Propiedad;Periodo desde;Periodo hasta;Meses alquilados;Ingresos íntegros (€);Gastos deducibles (€);Rendimiento neto (€)\n';
  data.forEach(r=>{
    csv+=`${r.prop};${r.desde};${r.hasta};${r.meses};${r.ingTotal};${r.gasTotal};${r.neto}\n`;
  });
  csv+='\n';
  csv+='DETALLE GASTOS\n';
  csv+='Propiedad;Concepto;€/mes;Meses;Total (€)\n';
  data.forEach(r=>{
    r.gastos.forEach(g=>{
      csv+=`${r.prop};${g.concepto};${g.importe};${g.meses};${g.total}\n`;
    });
  });
  const tot=data.reduce((a,r)=>({ing:a.ing+r.ingTotal,gas:a.gas+r.gasTotal}),{ing:0,gas:0});
  csv+=`\nTOTAL;;;;;${tot.ing};${tot.gas};${tot.ing-tot.gas}\n`;
  csv+=`\nGenerado el;${new Date().toLocaleDateString('es-ES')}\n`;

  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='gestoria_renta_'+_gAnio+'.csv';a.click();
  URL.revokeObjectURL(url);
}

function toggleSeguroForm(propId,tipo){
  const el=document.getElementById('seg-form-'+propId+'-'+tipo);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}

function guardarSeguro(propId,tipo){
  const p=propiedades.find(x=>x.id===propId);
  if(!p) return;
  if(!p.seguros) p.seguros={};
  if(!p.seguros[tipo]) p.seguros[tipo]={};
  const s=p.seguros[tipo];
  s.compania=document.getElementById('sf-comp-'+propId+'-'+tipo).value.trim();
  s.telefono=document.getElementById('sf-tel-'+propId+'-'+tipo).value.trim();
  s.importe=parseFloat(document.getElementById('sf-imp-'+propId+'-'+tipo).value)||null;
  const periodoNuevo=document.getElementById('sf-per-'+propId+'-'+tipo).value;
  s.periodo=periodoNuevo;
  const pagoEl=document.getElementById('sf-pago-'+propId+'-'+tipo);
  s.proximoPago=(periodoNuevo==='Mensual')?null:(pagoEl?pagoEl.value||null:null);
  const nuevaRen=document.getElementById('sf-ren-'+propId+'-'+tipo).value||null;
  if(nuevaRen!==s.renovacion)s.alertaDescartada=false;
  s.renovacion=nuevaRen;
  s.poliza=document.getElementById('sf-pol-'+propId+'-'+tipo).value.trim();
  s.notas=document.getElementById('sf-not-'+propId+'-'+tipo).value.trim();
  saveData();
  window._dTab='seguros';
  renderDetalle(document.getElementById('main-content'));
}

    </div>

  return html;
}

function guardarDocumentos(propId){
  const p=propiedades.find(x=>x.id===propId);
  if(!p) return;
  if(!p.documentos) p.documentos={};
  const d=p.documentos;
  // Nota Simple - sin campos de datos, solo archivo
  // Catastral
  const catRef=document.getElementById('doc-cat-ref-'+propId);
  const catSup=document.getElementById('doc-cat-sup-'+propId);
  const catNotas=document.getElementById('doc-cat-notas-'+propId);
  if(catRef) d.catastralRef=catRef.value.trim();
  if(catSup) d.catastralSuperficie=parseFloat(catSup.value)||null;
  if(catNotas) d.catastralNotas=catNotas.value.trim();
  saveData();
  window._dTab='documentos';
  renderDetalle(document.getElementById('main-content'));
  showToast('✓ Guardado');
}

function subirDocProp(propId,campo,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const p=propiedades.find(x=>x.id===propId);
    if(!p.documentos) p.documentos={};
    p.documentos[campo]={nombre:file.name,data:e.target.result,fecha:new Date().toLocaleDateString('es-ES')};
    saveData();
    window._dTab='documentos';
    renderDetalle(document.getElementById('main-content'));
  };
  reader.readAsDataURL(file);
}

function borrarDocProp(propId,campo){
  if(!confirm('¿Eliminar este documento?'))return;
  const p=propiedades.find(x=>x.id===propId);
  if(p.documentos) delete p.documentos[campo];
  saveData();
  window._dTab='documentos';
  renderDetalle(document.getElementById('main-content'));
}

<script>

function diasHasta(f){if(!f)return null;const a=new Date(hoyISO()+'T00:00:00'),b=new Date(String(f).slice(0,10)+'T00:00:00');return Math.round((b-a)/86400000);}
function fFecha(f){if(!f)return'—';const s=String(f).slice(0,10).split('-');return s[2]+'/'+s[1]+'/'+s[0];}

// ── Archivos: fotos se comprimen, PDFs con límite ──
const MAX_ARCHIVO=1.5*1024*1024;
function leerArchivo(file,cb){
  if(!file)return;
  if(/^image\//.test(file.type)){
    const fr=new FileReader();
    fr.onload=e=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb({nombre:file.name.replace(/\.\w+$/,'')+'.jpg',data:cv.toDataURL('image/jpeg',0.72),fecha:hoyISO()});
    };img.onerror=()=>alert('No se pudo leer la imagen.');img.src=e.target.result;};
    fr.readAsDataURL(file);return;
  }
  if(file.size>MAX_ARCHIVO){alert('El archivo pesa '+(file.size/1048576).toFixed(1)+' MB. El máximo es 1,5 MB para que la app siga sincronizando rápido. Prueba a subir una foto o un PDF comprimido.');return;}
  const fr=new FileReader();fr.onload=e=>cb({nombre:file.name,data:e.target.result,fecha:hoyISO()});fr.readAsDataURL(file);
}
function abrirArchivo(data,nombre){
  try{const a=document.createElement('a');a.href=data;a.download=nombre||'documento';
    if(/^data:(image|application\/pdf)/.test(data)){const w=window.open();if(w){w.document.write('<title>'+esc(nombre)+'</title><iframe src="'+data+'" style="border:0;position:fixed;inset:0;width:100%;height:100%"></iframe>');return;}}
    a.click();}catch(e){alert('No se pudo abrir el archivo');}
}

// ════════ 1·2·3 ANÁLISIS: rentabilidad, previsión y habitaciones ════════
window._anTab=window._anTab||'cash';window._anAnio=window._anAnio||ANIO_ACTUAL;
function datosCaja(y){
  const hasta=y===ANIO_ACTUAL?MES_ACTUAL:12, map={}, tot=Array.from({length:12},()=>({i:0,g:0,real:false}));
  for(let m=1;m<=hasta;m++){
    cajaMes(y,m).forEach(b=>{
      const r=map[b.key]=map[b.key]||{key:b.key,nombre:b.nombre,p:b.p,partes:b.partes,meses:Array.from({length:12},()=>null)};
      const i=sumL(b.ing),g=sumL(b.gas);r.meses[m-1]={i,g};tot[m-1].i+=i;tot[m-1].g+=g;tot[m-1].real=true;
    });
  }
  return{filas:Object.values(map),tot,hasta};
}
function ultimos12(key){
  let i=0,g=0,n=0,y=ANIO_ACTUAL,m=MES_ACTUAL;
  for(let k=0;k<12;k++){
    const b=cajaMes(y,m).find(x=>x.key===key);
    if(b){i+=sumL(b.ing);g+=sumL(b.gas);n++;}
    m--;if(m===0){m=12;y--;}
  }
  return{i,g,n};
}
function barras(vals,etiquetas,futuros){
  const max=Math.max(1,...vals.map(v=>Math.abs(v)));
  return`<div class="nv-bar-wrap">${vals.map((v,k)=>`<div class="nv-bar" title="${etiquetas[k]}: ${fmt(v)} €"><i class="${v<0?'n':''}${futuros&&futuros[k]?' f':''}" style="height:${Math.max(2,Math.abs(v)/max*100)}%"></i><span>${etiquetas[k]}</span></div>`).join('')}</div>`;
}
function renderAnalisis(c){
  const tab=window._anTab;
  const seg=`<div class="nv-seg">
    <button class="${tab==='cash'?'on':''}" onclick="window._anTab='cash';renderSection('analisis')">💶 Rentabilidad</button>
    <button class="${tab==='prev'?'on':''}" onclick="window._anTab='prev';renderSection('analisis')">🔮 Previsión ${ANIO_ACTUAL}</button>
    <button class="${tab==='hab'?'on':''}" onclick="window._anTab='hab';renderSection('analisis')">🚪 Habitaciones</button>
  </div>`;
  if(tab==='prev')return c.innerHTML=seg+htmlPrevision();
  if(tab==='hab')return c.innerHTML=seg+htmlHabitaciones();
  c.innerHTML=seg+htmlCashflow();
}
function htmlCashflow(){
  const y=window._anAnio, d=datosCaja(y);
  const I=d.tot.reduce((s,t)=>s+t.i,0),G=d.tot.reduce((s,t)=>s+t.g,0),N=I-G;
  const netos=d.tot.map(t=>t.i-t.g);
  const filas=d.filas.filter(f=>f.key!=='otros').map(f=>{
    const i=f.meses.reduce((s,x)=>s+(x?x.i:0),0),g=f.meses.reduce((s,x)=>s+(x?x.g:0),0);
    const u=ultimos12(f.key),inv=_extra.inversion[f.key]||{};
    const coste=((+inv.precio||0)+(+inv.gastos||0))/(f.partes||1), aport=(+inv.aportado||0)/(f.partes||1);
    const bruta=coste?u.i/u.n*12/coste*100:NaN, neta=coste?(u.i-u.g)/u.n*12/coste*100:NaN, coc=aport?(u.i-u.g)/u.n*12/aport*100:NaN;
    const meses=f.meses.filter(Boolean).length;
    return{f,i,g,n:i-g,media:meses?(i-g)/meses:0,bruta,neta,coc,tieneInv:!!coste,u};
  }).sort((a,b)=>b.n-a.n);
  const otros=d.filas.find(f=>f.key==='otros');
  const oN=otros?otros.meses.reduce((s,x)=>s+(x?x.i-x.g:0),0):0;
  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;">
    <button class="btn btn-secondary btn-sm" onclick="window._anAnio--;renderSection('analisis')">‹</button>
    <div style="font-weight:800;">${y}${y===ANIO_ACTUAL?' · hasta '+NOMBRES_MES[MES_ACTUAL-1].toLowerCase():''}</div>
    <button class="btn btn-secondary btn-sm" ${y>=ANIO_ACTUAL?'disabled style="opacity:.3"':''} onclick="window._anAnio++;renderSection('analisis')">›</button>
  </div>
  <div class="nv-kpis">
    <div class="nv-kpi"><div class="k">Entradas</div><div class="v inf">${eur(I)}</div></div>
    <div class="nv-kpi"><div class="k">Salidas</div><div class="v neg">${eur(G)}</div></div>
    <div class="nv-kpi"><div class="k">Neto</div><div class="v ${N>=0?'pos':'neg'}">${eur(N)}</div><div class="s">${eur(N/(d.hasta||1))}/mes</div></div>
  </div>
  <div class="card"><div class="sec-title" style="font-size:.9rem;">Dinero que te queda cada mes</div>
    ${barras(netos.slice(0,y===ANIO_ACTUAL?MES_ACTUAL:12),NOMBRES_MES.map(n=>n.slice(0,1)))}
  </div>
  <div class="sec-title" style="font-size:.9rem;margin-top:.4rem;">Por piso <span style="font-weight:500;color:var(--ink-3);font-size:.72rem;">· siempre tu parte</span></div>
  ${filas.map(r=>`<div class="card">
    <div class="card-header"><div><div class="card-title">${esc(r.f.nombre)}</div><div class="card-subtitle">${r.f.partes>1?'Tu parte (÷'+r.f.partes+')':'100 % tuyo'} · media ${eur(r.media)}/mes</div></div>
    <div style="text-align:right"><div class="nv-big ${r.n>=0?'pos':'neg'}">${eur(r.n)}</div><div class="nv-s">neto ${y}</div></div></div>
    <div class="stats3"><div class="stat-box"><div class="stat-label">Entradas</div><div class="stat-val blue">${eur(r.i)}</div></div>
    <div class="stat-box"><div class="stat-label">Salidas</div><div class="stat-val red">${eur(r.g)}</div></div>
    <div class="stat-box"><div class="stat-label">Margen</div><div class="stat-val">${r.i?pct((r.n)/r.i*100):'—'}</div></div></div>
    ${r.f.p&&r.f.p.tipo!=='gestion'?htmlRentab(r.f.key):''}
  </div>`).join('')||'<div class="nv-empty"><div>📭</div>Sin movimientos este año</div>'}
  ${otros?`<div class="card"><div class="dr"><span class="lbl">Otros movimientos (no son de ningún piso)</span><span class="val ${oN>=0?'pos':'neg'}">${eur(oN)}</span></div></div>`:''}
  <div class="nv-note">Los números salen del control de caja de Resumen (lo que te entra y sale a ti cada mes). Esta pantalla solo los lee: no cambia nada.</div>`;
}
const RE_HIPO=/hipoteca|pr[eé]stamo/i;
// Rentabilidad de un piso con los últimos 12 meses de caja (tu parte)
function rentab(key){
  const p=propiedades.find(x=>String(x.id)===String(key));if(!p)return null;
  const n=partesProp(p),inv=_extra.inversion[String(key)]||{};
  let i=0,gOp=0,gH=0,meses=0,y=ANIO_ACTUAL,m=MES_ACTUAL;
  for(let k=0;k<12;k++){
    const b=cajaMes(y,m).find(x=>x.key===String(key));
    if(b){meses++;i+=sumL(b.ing);b.gas.forEach(l=>{if(RE_HIPO.test(l.c||''))gH+=(+l.i||0);else gOp+=(+l.i||0);});}
    m--;if(m===0){m=12;y--;}
  }
  if(!meses)return null;
  const f=12/meses,ingA=i*f,gOpA=gOp*f,netoOp=ingA-gOpA;
  const cuotaPropia=+inv.cuota>0, cuotaMes=cuotaPropia?(+inv.cuota)/n:gH*f/12, hipA=cuotaMes*12;
  const cf=netoOp-hipA;
  const coste=((+inv.precio||0)+(+inv.gastos||0))/n;
  const hayHipo=hipA>0;
  // Dinero puesto: lo que escribas; si está vacío y no hay hipoteca, se entiende que lo pagaste todo
  let aport=(inv.aportado===''||inv.aportado==null)?(hayHipo?null:coste):(+inv.aportado)/n;
  const bruta=coste?ingA/coste*100:NaN,neta=coste?netoOp/coste*100:NaN;
  const coc=aport==null?NaN:aport>0?cf/aport*100:(cf>0?Infinity:NaN);
  return{p,n,meses,ingA,gOpA,netoOp,cuotaMes,cuotaPropia,hipA,cf,cfMes:cf/12,coste,aport,bruta,neta,coc,hayHipo,
    recupera:aport>0&&cf>0?aport/cf:NaN};
}
function tienePrestamo(inv){return inv&&+inv.prestamo>0&&+inv.tipo>0&&+inv.plazo>0&&/^\d{4}-\d{2}$/.test(inv.firma||'');}
function cuotaPrestamo(inv){const P=+inv.prestamo,r=(+inv.tipo)/1200,N=(+inv.plazo)*12;return r?P*r/(1-Math.pow(1+r,-N)):P/N;}
// Intereses de la cuota de ese mes (préstamo completo). La primera cuota es el mes "firma".
function interesMes(inv,y,m){
  if(!tienePrestamo(inv))return 0;
  const [fy,fm]=inv.firma.split('-').map(Number),k=(y-fy)*12+(m-fm),N=(+inv.plazo)*12;
  if(k<0||k>=N)return 0;
  const P=+inv.prestamo,r=(+inv.tipo)/1200,c=cuotaPrestamo(inv),q=Math.pow(1+r,k);
  const saldo=P*q-c*(q-1)/r;return Math.max(0,saldo*r);
}
function interesesAnio(inv,y){let s=0;for(let m=1;m<=12;m++)s+=interesMes(inv,y,m);return s;}
function htmlRentab(key){
  const r=rentab(key);if(!r)return'';
  const conPrecio=r.coste>0;
  const cocTxt=r.coc===Infinity?'∞':isFinite(r.coc)?pct(r.coc):'—';
  return`<div class="nv-rent">
    <div class="nv-rent-row"><span>Te deja al año <small>(rentas − gastos, sin hipoteca)</small></span><b class="${r.netoOp>=0?'pos':'neg'}">${eur(r.netoOp)}</b></div>
    ${r.hayHipo?`<div class="nv-rent-row"><span>Hipoteca <small>${eur2(r.cuotaMes)}/mes${r.cuotaPropia?'':' · sacada de la caja'}</small></span><b class="neg">−${eur(r.hipA)}</b></div>`:''}
    <div class="nv-rent-row tot"><span>Cash flow <small>lo que te queda limpio</small></span><b class="${r.cf>=0?'pos':'neg'}">${r.cf>=0?'+':''}${eur(r.cfMes)}/mes</b></div>
    <div class="nv-rent-sub">${eur(r.cf)} al año${r.aport!=null?(r.aport>0?` · pusiste ${eur(r.aport)}`+(isFinite(r.recupera)?` · lo recuperas en ${(Math.round(r.recupera*10)/10).toLocaleString('es-ES')} años`:''):' · no pusiste dinero: todo lo que deja es ganancia sobre 0 €'):''}</div>
  </div>
  ${conPrecio?`<div class="stats3" style="margin:.5rem 0 .3rem;">
    <div class="stat-box"><div class="stat-label">Rent. bruta</div><div class="stat-val">${pct(r.bruta)}</div></div>

function eventosAgenda(desde,hasta){
  const ev=[],dentro=f=>f&&f>=desde&&f<=hasta;
  listarInquilinos().forEach(t=>{
    if(dentro(t.fin))ev.push({f:t.fin,c:'r',e:'🏁',t:'Fin de contrato · '+t.nombre,s:t.prop+' · '+t.hab});
    if(t.entrada){const md=t.entrada.slice(5,10);for(let y=+desde.slice(0,4);y<=+hasta.slice(0,4);y++){const f=y+'-'+md;if(dentro(f)&&y>+t.entrada.slice(0,4))ev.push({f,c:'a',e:'📈',t:'Subida IPC · '+t.nombre,s:t.prop+' · '+(y-(+t.entrada.slice(0,4)))+'º aniversario'});}}
    const ex=_extra.expedientes[t.key];
    if(ex)(ex.docs||[]).forEach(d=>{if(dentro(d.caduca))ev.push({f:d.caduca,c:'v',e:'📄',t:'Caduca '+d.tipo+' · '+t.nombre,s:t.prop});});
  });
  propiedades.forEach(p=>{
    if(p.seguros)['hogar','alquiler','vida'].forEach(k=>{const s=p.seguros[k];if(s&&dentro(s.renovacion))ev.push({f:s.renovacion,c:'v',e:'🛡️',t:'Renovación seguro '+k,s:p.nombre+(s.compania?' · '+s.compania:'')});});
  });
  _extra.recordatorios.forEach(r=>{
    if(!r.fecha)return;
    const push=f=>{if(dentro(f))ev.push({f,c:'',e:'🔔',t:r.titulo,s:(nombrePiso(r.propId)||'Recordatorio')+(r.repite!=='no'?' · cada '+(r.repite==='anual'?'año':'mes'):''),rid:r.id,hecho:!!(r.hechos&&r.hechos[f])});};
    if(r.repite==='anual'){for(let y=+desde.slice(0,4);y<=+hasta.slice(0,4);y++)push(y+r.fecha.slice(4));}
    else if(r.repite==='mensual'){let [y,m]=desde.slice(0,7).split('-').map(Number);const dd=r.fecha.slice(8,10);for(let k=0;k<26;k++){const f=y+'-'+String(m).padStart(2,'0')+'-'+dd;if(f>=r.fecha)push(f);m++;if(m>12){m=1;y++;}if(f>hasta)break;}}
    else push(r.fecha);
  });
  return ev.sort((a,b)=>a.f<b.f?-1:1);
}

  if(y>ANIO_ACTUAL||(y===ANIO_ACTUAL&&m>MES_ACTUAL)){y=ANIO_ACTUAL;m=MES_ACTUAL;}

function modalReparto(){
  const pisos=propiedades.filter(p=>listarInquilinos().some(t=>t.propId===p.id));
  const hoy=new Date(),d0=new Date(hoy.getFullYear(),hoy.getMonth()-1,1),d1=new Date(hoy.getFullYear(),hoy.getMonth(),0);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button><div class="modal-title">Repartir factura</div>
  <div class="field-row"><div class="field"><label>Piso</label><select id="rp-p" onchange="pintarParticipantes()">${pisos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>
  <div class="field"><label>Factura de</label><select id="rp-t"><option>Luz</option><option>Agua</option><option>Gas</option><option>Internet</option><option>Otros</option></select></div></div>
  <div class="field-row"><div class="field"><label>Importe (€)</label><input id="rp-i" type="number" inputmode="decimal" oninput="pintarParticipantes()"/></div>
  <div class="field"><label>Cómo repartir</label><select id="rp-m" onchange="pintarParticipantes()"><option value="iguales">A partes iguales</option><option value="dias">Por días de estancia</option></select></div></div>
  <div class="field-row"><div class="field"><label>Desde</label><input id="rp-d" type="date" value="${iso(d0)}" onchange="pintarParticipantes()"/></div><div class="field"><label>Hasta</label><input id="rp-h" type="date" value="${iso(d1)}" onchange="pintarParticipantes()"/></div></div>
  <label class="nv-lbl"><input type="checkbox" id="rp-yo" onchange="pintarParticipantes()"/> Yo también pago una parte</label>
  <div id="rp-lista" style="margin-top:.5rem;"></div>
  <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarReparto()">Guardar reparto</button></div>`);
  window._rpSel=null;pintarParticipantes();
}
function calcReparto(){
  const g=k=>document.getElementById(k);
  const pid=+g('rp-p').value,imp=r2(g('rp-i').value),met=g('rp-m').value,desde=g('rp-d').value,hasta=g('rp-h').value;
  const D=new Date(desde+'T00:00:00'),H=new Date(hasta+'T00:00:00'),total=Math.max(1,Math.round((H-D)/86400000)+1);
  let gente=listarInquilinos().filter(t=>t.propId===pid).map(t=>{
    const e=t.entrada?new Date(t.entrada+'T00:00:00'):D,f=t.fin?new Date(t.fin+'T00:00:00'):H;
    const a=e>D?e:D,b=f<H?f:H;return Object.assign({},t,{dias:b>=a?Math.round((b-a)/86400000)+1:0});
  });
  if(g('rp-yo').checked)gente.push({key:'yo',nombre:'Yo (propietario)',tel:'',email:'',dias:total});
  window._rpSel=window._rpSel||{};
  gente.forEach(x=>{if(window._rpSel[x.key]===undefined)window._rpSel[x.key]=x.dias>0;});
  const act=gente.filter(x=>window._rpSel[x.key]);
  const base=met==='dias'?act.reduce((s,x)=>s+x.dias,0):act.length;
  gente.forEach(x=>{x.on=!!window._rpSel[x.key];x.importe=x.on&&base?r2(imp*(met==='dias'?x.dias:1)/base):0;});
  // cuadrar céntimos
  const dif=r2(imp-gente.reduce((s,x)=>s+x.importe,0));const pri=gente.find(x=>x.on);if(pri&&Math.abs(dif)<0.05)pri.importe=r2(pri.importe+dif);
  return{pid,imp,met,desde,hasta,gente,total};
}
function pintarParticipantes(){
  const r=calcReparto();
  document.getElementById('rp-lista').innerHTML=r.gente.map(x=>`<div class="nv-doc"><input type="checkbox" ${x.on?'checked':''} onchange="window._rpSel['${escJs(x.key)}']=this.checked;pintarParticipantes()"/>
    <div class="n"><div>${esc(x.nombre)}</div><div>${x.dias} de ${r.total} días</div></div><b>${eur2(x.importe)}</b></div>`).join('')||'<div class="nv-s">Este piso no tiene inquilinos.</div>';
}
function guardarReparto(){
  const r=calcReparto();
  if(!r.imp){alert('Pon el importe de la factura');return;}
  const partes=r.gente.filter(x=>x.on&&x.key!=='yo').map(x=>({key:x.key,nombre:x.nombre,tel:x.tel,email:x.email,dias:x.dias,importe:x.importe,cobrado:false}));
  if(!partes.length){alert('Marca al menos un inquilino');return;}
  _extra.repartos.push({id:xid(),propId:r.pid,tipo:document.getElementById('rp-t').value,importe:r.imp,desde:r.desde,hasta:r.hasta,metodo:r.met,partes,creado:hoyISO()});

}

function cargarSheetJS(){
  return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=()=>ok();s.onerror=ko;document.head.appendChild(s);});

async function exportarExcel(y){
  const {d,conceptos,movs}=datosInforme(y);
  const pisos=d.filas.map(f=>{const i=f.meses.reduce((s,x)=>s+(x?x.i:0),0),g=f.meses.reduce((s,x)=>s+(x?x.g:0),0);return{Piso:f.nombre,'Tu parte':f.partes>1?'1/'+f.partes:'100%',Entradas:r2(i),Salidas:r2(g),Neto:r2(i-g)};});
  const meses=[];d.filas.forEach(f=>f.meses.forEach((x,k)=>{if(x)meses.push({Mes:NOMBRES_MES[k],Piso:f.nombre,Entradas:r2(x.i),Salidas:r2(x.g),Neto:r2(x.i-x.g)});}));
  const mov=movs.map(m=>({Mes:NOMBRES_MES[m.mes-1],Piso:m.piso,Tipo:m.tipo,Concepto:m.concepto,Importe:r2(m.importe)}));
  const con=Object.entries(conceptos).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Concepto:k,Total:r2(v)}));
  const inc=_extra.incidencias.filter(i=>(i.fecha||'').startsWith(String(y))).map(i=>({Fecha:i.fecha,Piso:nombrePiso(i.propId),Incidencia:i.titulo,Estado:i.estado,Proveedor:i.proveedor,Coste:+i.coste||0,Paga:i.paga}));
  try{
    showToast('⏳ Preparando Excel…');await cargarSheetJS();
    const wb=XLSX.utils.book_new(),add=(n,rows)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'':'Sin datos'}]);ws['!cols']=Object.keys(rows[0]||{a:1}).map(k=>({wch:Math.max(12,k.length+4,k==='Concepto'||k==='Incidencia'?34:0)}));XLSX.utils.book_append_sheet(wb,ws,n);};
    pisos.push({Piso:'TOTAL','Tu parte':'',Entradas:r2(pisos.reduce((s,x)=>s+x.Entradas,0)),Salidas:r2(pisos.reduce((s,x)=>s+x.Salidas,0)),Neto:r2(pisos.reduce((s,x)=>s+x.Neto,0))});
    add('Resumen por piso',pisos);add('Mes a mes',meses);add('Movimientos',mov);add('Gastos por concepto',con);add('Incidencias',inc);
    XLSX.writeFile(wb,'Mis_Alquileres_'+y+'.xlsx');

// ════════ 9 CALCULADORA DE COMPRA ════════
const CALC_DEF={nombre:'',precio:120000,itp:7,otros:1.5,reforma:5000,fin:80,interes:3,anios:30,renta:750,nHab:4,precioHab:350,ocupacion:92,vacio:4,comunidad:50,ibi:300,seguro:180,mant:3,gestion:0,sumHab:120};
function calcular(v){
  const coste=v.precio*(1+(v.itp+v.otros)/100)+v.reforma, prest=v.precio*v.fin/100, r=v.interes/1200, n=v.anios*12;
  const cuota=prest?(r?prest*r/(1-Math.pow(1+r,-n)):prest/n):0, aport=coste-prest;
  const fijos=v.comunidad*12+v.ibi+v.seguro;
  const escn=(ing,extra)=>{const gas=fijos+ing*(v.mant+v.gestion)/100+extra, neto=ing-gas, cf=neto-cuota*12;
    return{ing,gas,neto,bruta:ing/coste*100,neta:neto/coste*100,cf,cfMes:cf/12,coc:aport>0?cf/aport*100:NaN,anios:neto>0?coste/neto:NaN};};
  return{coste,prest,cuota,aport,entero:escn(v.renta*12*(1-v.vacio/100),0),hab:escn(v.nHab*v.precioHab*12*v.ocupacion/100,v.sumHab*12)};
}

  <div class="card"><div class="sec-title" style="font-size:.9rem;">🏦 Hipoteca</div>
    <div class="nv-grid2">${inp('fin','Financiado','% del precio')}${inp('interes','Interés','% anual')}${inp('anios','Plazo','años')}</div></div>

    <div class="nv-grid2">${inp('renta','Alquiler entero','€/mes')}${inp('vacio','Meses vacío','% del año')}${inp('nHab','Habitaciones','nº',1)}${inp('precioHab','Precio por habitación','€/mes')}${inp('ocupacion','Ocupación habitaciones','%')}${inp('sumHab','Suministros que pagas (hab.)','€/mes')}</div></div>
  <div class="card"><div class="sec-title" style="font-size:.9rem;">🧾 Gastos</div>
    <div class="nv-grid2">${inp('comunidad','Comunidad','€/mes')}${inp('ibi','IBI','€/año')}${inp('seguro','Seguros','€/año')}${inp('mant','Mantenimiento','% renta')}${inp('gestion','Gestión','% renta')}</div></div>
  <div class="card"><div class="sec-title" style="font-size:.9rem;">💾 Guardar escenario</div>
    <div style="display:flex;gap:.4rem;"><input class="nv-in" id="calc-nom" placeholder="Ej. Piso calle Feria 3ºA" value="${esc(v.nombre||'')}"/><button class="btn btn-primary" onclick="guardarEscenario()">Guardar</button></div>
    ${_extra.escenarios.map(e=>{const r=calcular(Object.assign({},CALC_DEF,e));return`<div class="nv-item" style="padding:.5rem 0;"><div style="flex:1;cursor:pointer" onclick="cargarEscenario(${e.id})"><div class="nv-t" style="font-size:.82rem;">${esc(e.nombre)}</div><div class="nv-s">${eur(e.precio)} · entero ${pct(r.entero.neta)} · hab. ${pct(r.hab.neta)} neta</div></div><button class="cj-mini del" onclick="borrarEscenario(${e.id})">✕</button></div>`;}).join('')}
  </div>
  <div class="nv-note">ITP en Andalucía: 7 % para vivienda usada (comprueba si te aplica un tipo reducido). En obra nueva sería 10 % de IVA + AJD. Es una estimación orientativa, no tiene en cuenta impuestos sobre la renta.</div>`;

function calcSet(k,val){_extra.calc=Object.assign({},CALC_DEF,_extra.calc||{});_extra.calc[k]=parseFloat(String(val).replace(',','.'))||0;pintarCalc();clearTimeout(window._calcT);window._calcT=setTimeout(saveData,1200);}

    <div class="row"><span>Aportas ${eur(r.aport)}</span><span>Hipoteca ${eur(r.prest)}</span><span>Cuota ${eur2(r.cuota)}/mes</span></div></div>
  <div class="nv-grid2" style="margin-bottom:.6rem;">${col('🏠 Entero',r.entero)}${col('🚪 Por habitaciones',r.hab)}</div>
  <div class="info-box">👉 Con estos datos sale mejor <b>${mejor}</b>: ${eur(Math.abs(r.hab.cf-r.entero.cf))} más al año.</div>`;
}
function guardarEscenario(){const nom=document.getElementById('calc-nom').value.trim();if(!nom){alert('Ponle un nombre');return;}
  _extra.escenarios.push(Object.assign({},CALC_DEF,_extra.calc||{},{nombre:nom,id:xid()}));saveData();renderSection('calculadora');showToast('✓ Escenario guardado');}

window._pFiltro=window._pFiltro||'todos';
function estadoPiso(p){
  const al=getAlertas().filter(a=>a.propId===p.id);
  const cobros=al.filter(a=>a.tipo==='cobro'),sums=al.filter(a=>a.tipo==='suministro');
  const inc=_extra.incidencias.filter(i=>+i.propId===p.id&&i.estado!=='Cerrada');
  const inqs=listarInquilinos().filter(t=>t.propId===p.id);
  const vence=inqs.map(t=>({t,d:diasHasta(t.fin)})).filter(x=>x.d!=null&&x.d>=0&&x.d<=60).sort((a,b)=>a.d-b.d)[0];
  const libres=p.tipo==='habitaciones'?(p.habitaciones||[]).filter(h=>!h.inquilino).length:0;
  let color='ok',txt='Al día';
  if(p.tipo==='gestion'){txt='Ingreso de gestión';}
  if(p.estado==='libre'||(p.tipo!=='habitaciones'&&p.tipo!=='gestion'&&!inqs.length)){color='warn';txt='Sin inquilino';}
  if(p.estado==='reforma'){color='warn';txt='En reforma';}
  if(libres){color='warn';txt=libres+' hab. libre'+(libres>1?'s':'');}
  if(vence){color='warn';txt='Contrato acaba en '+vence.d+' d';}
  if(sums.length){color='warn';txt=sums.length+' suministro'+(sums.length>1?'s':'')+' por cobrar';}
  if(inc.length){color='warn';txt=inc.length+' incidencia'+(inc.length>1?'s':'');}
  if(cobros.length){color='bad';txt=cobros.length>1?cobros.length+' rentas pendientes':'Renta pendiente';}
  return{color,txt,cobros,sums,inc,inqs,libres};
}
function rentPiso(p){const r=rentab(p.id);return r&&r.coste>0?r.neta:null;}

function infoMR(){
  const v=document.getElementById('mr-p').value,p=propiedades.find(x=>String(x.id)===v),n=p?partesProp(p):1,imp=r2(document.getElementById('mr-i').value);
  document.getElementById('mr-div-w').style.display=n>1?'block':'none';
  const div=n>1&&document.getElementById('mr-div').checked;
  document.getElementById('mr-info').textContent=imp?('Se apuntará '+fmtDec(div?imp/n:imp)+' € en la caja del mes'+(div?' (tu parte, ÷'+n+')':'')+'.'):'Va directo a la caja del mes (Inicio).';

function guardarMR(lado){
  const v=document.getElementById('mr-p').value,p=propiedades.find(x=>String(x.id)===v),imp=r2(document.getElementById('mr-i').value),c=document.getElementById('mr-c').value.trim();
  const [y,m]=document.getElementById('mr-m').value.split('-').map(Number);
  if(!imp){alert('Pon el importe');return;}if(!c){alert('Pon un concepto');return;}if(!y||!m){alert('Elige el mes');return;}
  const n=p?partesProp(p):1,div=n>1&&document.getElementById('mr-div').checked;
  cajaEditable(y,m,p?String(p.id):'otros')[lado].push({c,i:r2(div?imp/n:imp)});

}

<script>
// ════════════════════════════════════════════════════════════════════
//  DATOS PARA LA RENTA (porcentaje fiscal, referencia catastral, NIF,
//  amortización, casillas). Solo afecta a la exportación a la gestoría.
// ════════════════════════════════════════════════════════════════════
// Datos sacados de la renta 2025 (rectificativa). Solo rellenan huecos.
const RENTA_2025=[
  {m:/oliva/i,d:{ref:'7196107TG3379N0009ZO',dir:'BO NUESTRA SRA DE LA OLIVA 0133 1 04 B SEVILLA',pct:50,tipoAdq:'Onerosa',fechaAdq:'2020-12-30',impAdq:28000,vct:8204.95,vcc:4688.68,m2:78,revisado:false,nifs:'12079205',extranjero:true,fechaContrato:'2025-05-01',reduccion:50,intereses:{2025:771.5},banco:'ING'}},
  {m:/nueva\s*europa.*3\s*[-\/ ]?\s*2/i,d:{ref:'7095103TG3379N0014DA',dir:'GR NUEVA EUROPA 0004 03 02 SEVILLA',pct:50,vct:10522.94,vcc:6234.99,m2:95,revisado:false}},
  {m:/nueva\s*europa.*3\s*[-\/ ]?\s*1/i,d:{ref:'7095103TG3379N0013SP',dir:'GR NUEVA EUROPA 0004 03 01 SEVILLA',pct:50,vct:10175.02,vcc:6028.43,m2:92,revisado:false}},
  {m:/san\s*pablo|momplet/i,d:{ref:'8333005TG3483S0001HI',dir:'CL ANTONIO MOMPLET 0010 1 00 DR SEVILLA',pct:40,vct:5665.94,vcc:3005.71,m2:70,revisado:false}},
];
function fiscalBase(p){
  _extra.fiscal=_extra.fiscal||{};
  const guardado=_extra.fiscal[String(p.id)]||{},imp=(RENTA_2025.find(r=>r.m.test(p.nombre))||{}).d||{};
  const f=Object.assign({},imp,guardado);
  f.intereses=Object.assign({},imp.intereses||{},guardado.intereses||{});
  f.importado=Object.keys(imp).some(k=>guardado[k]==null);
  if(f.pct==null||f.pct==='')f.pct=Math.round(10000/partesProp(p))/100;
  if(f.reduccion==null)f.reduccion=50;

}
// ── Declarante: Jose (yo) o la pareja (cotitular). Los datos se guardan con tu parte
// y los de la pareja se calculan con su % de cada piso.
function declPareja(){return (_extra.ajustes&&_extra.ajustes.decl)==='pareja';}
function cotitular(){_extra.ajustes.cotitular=_extra.ajustes.cotitular||{nombre:'Alba García Molina',nif:''};return _extra.ajustes.cotitular;}
function pctYo(p){return +fiscalBase(p).pct||0;}
function pctPareja(p){const f=fiscalBase(p);if(f.pctPareja!=null&&f.pctPareja!=='')return +f.pctPareja;return /momplet|san\s*pablo/i.test(p.nombre)?0:pctYo(p);}
function ratioDecl(p){if(!declPareja())return 1;const y=pctYo(p);return y?pctPareja(p)/y:0;}
function fiscal(p){
  const f=fiscalBase(p);if(!declPareja())return f;
  const r=ratioDecl(p),g=Object.assign({},f,{pct:pctPareja(p)});
  ['impAdq','vct','vcc'].forEach(k=>{if(g[k])g[k]=r2(g[k]*r);});
  g.intereses={};Object.entries(f.intereses||{}).forEach(([y,v])=>{if(v!==''&&v!=null)g.intereses[y]=r2(v*r);});
  return g;
}
function nombreDecl(){return declPareja()?cotitular().nombre:'Jose Manuel Borja Herrera';}
function pctF(p){return +fiscal(p).pct||0;}
function factorF(p){return partesProp(p)*pctF(p)/100;}   // de "tu parte en la app" a "tu % en la renta"
function diasPeriodoBruto(sel){const [dy,dm]=sel.desde.split('-').map(Number),[hy,hm]=sel.hasta.split('-').map(Number);return Math.round((new Date(hy,hm,1)-new Date(dy,dm-1,1))/86400000);}
function claveParadas(pid,sel){return pid+'|'+sel.desde.slice(0,4);}
function paradasDe(pid,sel){_extra.paradas=_extra.paradas||{};return _extra.paradas[claveParadas(pid,sel)]||[];}
// Días parados que caen dentro del periodo
function diasParados(pid,sel){
  if(pid==null)return 0;
  const [dy,dm]=sel.desde.split('-').map(Number),[hy,hm]=sel.hasta.split('-').map(Number),A=new Date(dy,dm-1,1),B=new Date(hy,hm,0);
  return paradasDe(pid,sel).reduce((s,x)=>{if(!x.d||!x.h)return s;const a=new Date(x.d+'T00:00:00'),b=new Date(x.h+'T00:00:00'),i=a>A?a:A,f=b<B?b:B;return s+(f>=i?Math.round((f-i)/86400000)+1:0);},0);
}
function diasPeriodo(sel){return Math.max(0,diasPeriodoBruto(sel)-diasParados(sel.pid,sel));}

// Ingresos y gastos de la gestoría con el % de la renta
const _ingresoMioMesBase=ingresoMioMes;
ingresoMioMes=function(p,y,m){return _ingresoMioMesBase(p,y,m)*factorF(p);};
const _gestoriaGastosPropBase0=gestoriaGastosPropBase;
gestoriaGastosPropBase=function(p,sel,gs){
  const r=_gestoriaGastosPropBase0(p,sel,gs),f=factorF(p);
  const det=r.gastosDetalle.map(g=>({...g,total:r2(g.total*f),importe:g.importe*f}));
  return{gastosDetalle:det,gasTotal:det.reduce((a,g)=>a+g.total,0)};
};
// Amortización: 3 % del mayor entre coste de adquisición de la construcción y valor catastral de la construcción
amortizacion=function(p,sel){
  const f=fiscal(p),inv=_extra.inversion[String(p.id)]||{};
  const imp=+f.impAdq||(((+inv.precio||0)+(+inv.gastos||0))*pctF(p)/100);
  const vct=+f.vct||0,vcc=+f.vcc||0;
  if(!imp||!vct||!vcc||!sel)return null;
  const pc=Math.min(1,Math.round(vcc/vct*10000)/10000),costeConstr=r2(imp*pc),base=Math.max(costeConstr,vcc),anual=base*0.03,dias=diasPeriodo(sel);
  return{imp,pc,costeConstr,vcc,base,anual,dias,total:r2(anual*dias/365),n:1};
};
modalAmort=function(pid){modalFiscal(pid);};

// Clasificación en las casillas de la renta
const CLASES=[
  ['int','Intereses y gastos de financiación','0105'],
  ['rep','Reparación y conservación',''],
  ['com','Gastos de comunidad','0109'],
  ['ser','Servicios personales (gestión, administración…)',''],
  ['sum','Suministros',''],
  ['seg','Primas de seguros','0114'],
  ['tri','Tributos, recargos y tasas (IBI, basura…)','0115'],
  ['otr','Otros gastos deducibles',''],
];
function claseGasto(g){
  if(g.amort)return'amort';
  const c=String(g.clave||g.concepto||'').toLowerCase();
  if(RE_HIPO.test(c)||/inter[eé]s/.test(c))return'int';
  if(/repar|arregl|termo|fontan|pintur|electric|caldera|conserv|mantenim|obra|cerraj|persiana|aver/.test(c))return'rep';
  if(/comunidad/.test(c))return'com';
  if(/gesti[oó]n|administ|asesor|abogad|greg|agencia|honorar/.test(c))return'ser';
  if(/luz|agua|gas\b|internet|digi|endesa|iberdrola|emasesa|suministr|fibra|electricidad/.test(c))return'sum';
  if(/seguro/.test(c))return'seg';
  if(/ibi|basura|tasa|tribut|impuesto|contribuc/.test(c))return'tri';
  return'otr';
}
function fichaRenta(p){
  const sel=_gSeleccion[p.nombre],f=fiscal(p),dias=diasPeriodo(sel);
  let ing=0;mesesRango(sel.desde,sel.hasta).forEach(([y,m])=>ing+=ingresoMioMes(p,y,m));ing=r2(ing);
  const det=gestoriaGastosProp(p,sel,_gGastosSel[p.nombre]||{}).gastosDetalle,s={};
  det.forEach(g=>{const k=claseGasto(g);s[k]=(s[k]||0)+(+g.total||0);});
  const am=det.find(g=>g.amort),amort=am?+am.total||0:0;
  const intRep=(s.int||0)+(s.rep||0),aplic=Math.min(intRep,Math.max(0,ing)),exceso=r2(intRep-aplic);
  const resto=['com','ser','sum','seg','tri','otr'].reduce((a,k)=>a+(s[k]||0),0);
  const neto=r2(ing-aplic-resto-amort);
  const red=neto>0?r2(neto*(+f.reduccion||0)/100):0;
  const [dy]=sel.desde.split('-').map(Number),[hy]=sel.hasta.split('-').map(Number);
  let imput=null;
  if(dy===hy&&f.vct){const da=(dy%4===0?366:365),disp=Math.max(0,da-dias);imput={dias:disp,importe:r2(f.vct*(f.revisado?0.011:0.02)*disp/da)};}
  const amd=am&&am.am?am.am:amortizacion(p,sel);
  return{p,f,sel,dias,ing,s,aplic,exceso,neto,red,reducido:r2(neto-red),amort,amd,imput};
}

function guardarFiscal(pid){

    tipoAdq:g('fi-ta').startsWith('Oner')?'Onerosa':'Lucrativa',fechaAdq:g('fi-fa'),impAdq:n('fi-imp'),vct:n('fi-vct'),vcc:n('fi-vcc'),revisado:document.getElementById('fi-rev').checked,
    banco:g('fi-bco'),intereses:(()=>{const o=Object.assign({},window._fiInt||{}),y=g('fi-iy'),v=g('fi-iv');if(v==='')delete o[y];else o[y]=r2(v);return o;})()};
  saveData();closeModal();

// Paso 3: añadir la ficha bajo cada piso y la exportación
const _renderGestoriaConFicha=renderGestoria;
renderGestoria=function(c){
  _renderGestoriaConFicha(c);
  if(_gPaso!==3)return;
  const props=propiedades.filter(p=>p.tipo!=='gestion'&&_gSeleccion[p.nombre]&&_gSeleccion[p.nombre].incluir);if(!props.length)return;

  const cont=c.querySelector('.gst');if(!cont)return;
  cont.insertAdjacentHTML('beforeend',`<div class="sec-title" style="margin-top:1.4rem;">📋 Ficha para la renta</div>
    <div class="nv-note">Lo que va en cada casilla de la declaración, con tu % de propiedad, intereses en vez de cuota, amortización del 3 % y la reducción por vivienda. Los números de casilla son los de tu renta 2025.</div>
    <div class="nv-kpis"><div class="nv-kpi"><div class="k">Rend. neto reducido</div><div class="v ${tot>=0?'pos':'neg'}">${eur(tot)}</div><div class="s">suma de pisos</div></div>${imp?`<div class="nv-kpi"><div class="k">Rentas imputadas</div><div class="v">${eur(imp)}</div><div class="s">días sin alquilar</div></div>`:''}</div>

};
function filasFicha(fr){
  const f=fr.f,r=[['','Titular',nombreDecl()+(declPareja()&&cotitular().nif?' ('+cotitular().nif+')':'')],['0063','Porcentaje de propiedad',pctF(fr.p)+' %'],['0066','Referencia catastral',f.ref||''],['0069','Dirección',f.dir||''],['0101','Nº de días arrendado',fr.dias],
    ['0091','NIF del arrendatario',(f.nifs||'')+(f.extranjero?' (extranjero)':'')],['0093','Fecha del contrato',f.fechaContrato?fFecha(f.fechaContrato):''],['0100','Reducción por vivienda',f.reduccion?f.reduccion+' %':'No'],
    ['0102','Ingresos íntegros',r2(fr.ing)]];
  CLASES.forEach(([k,t,c])=>{if(fr.s[k])r.push([c,t,r2(fr.s[k])]);});
  if(fr.s.int||fr.s.rep)r.push(['0107','Intereses + reparación aplicados',r2(fr.aplic)]);
  if(fr.exceso>0)r.push(['','Exceso intereses+reparación (4 años siguientes)',fr.exceso]);
  r.push(['0118','Tipo de adquisición',f.tipoAdq||'Onerosa'],['0120','Fecha de adquisición',f.fechaAdq?fFecha(f.fechaAdq):''],['0123','Valor catastral',f.vct||''],['0124','Valor catastral construcción',f.vcc||''],
    ['0125','% construcción',f.vct&&f.vcc?(Math.round(f.vcc/f.vct*10000)/100).toLocaleString('es-ES')+' %':''],['0126','Importe de adquisición',fr.amd?r2(fr.amd.imp):''],['0130','Base de amortización',fr.amd?r2(fr.amd.base):''],['0131','Amortización del inmueble',r2(fr.amort)],
    ['0149','Rendimiento neto',fr.neto],['0150','Reducción arrendamiento vivienda',fr.red],['0154','Rendimiento neto reducido',fr.reducido]);
  if(fr.imput&&fr.imput.dias)r.push(['0085','Días a disposición (sin alquilar)',fr.imput.dias],['0089','Renta inmobiliaria imputada',fr.imput.importe]);
  return r;
}
function imprimirFichas(){
  const fs=window._fichas||[],w=window.open('','_blank');if(!w){alert('Permite las ventanas emergentes para generar el PDF');return;}
  const fmtV=v=>typeof v==='number'?v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':esc(v);
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ficha renta ${_gAnio}</title><style>body{font-family:-apple-system,Segoe UI,sans-serif;color:#0f172a;margin:24px;font-size:12px}h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:22px 0 6px;padding:6px 10px;background:#0f3d3e;color:#fff;border-radius:6px}table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #e5e7eb}td.c{width:48px;color:#64748b;font-family:monospace}td.v{text-align:right;font-weight:600;white-space:nowrap}.n{color:#64748b;font-size:11px}@media print{h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
  <h1>Rendimientos del capital inmobiliario · ${_gAnio}</h1><div style="font-size:13px;font-weight:700;margin-bottom:2px">Titular: ${esc(nombreDecl())}</div><div class="n">Generado con Mis Alquileres el ${new Date().toLocaleDateString('es-ES')}. Borrador para revisar con la gestoría.</div>
  ${fs.map(fr=>`<h2>${esc(fr.p.nombre)} · ${fFecha(fr.sel.desde+'-01')} – ${NOMBRES_MES[+fr.sel.hasta.split('-')[1]-1]} ${fr.sel.hasta.split('-')[0]}</h2><table>${filasFicha(fr).map(([c,t,v])=>`<tr><td class="c">${c}</td><td>${esc(t)}</td><td class="v">${fmtV(v)}</td></tr>`).join('')}</table>`).join('')}
  <script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close();
}
async function excelFichas(){
  const fs=window._fichas||[],rows=[];
  fs.forEach(fr=>{rows.push({Piso:fr.p.nombre,Casilla:'',Concepto:'Periodo '+fr.sel.desde+' a '+fr.sel.hasta,Valor:''});filasFicha(fr).forEach(([c,t,v])=>rows.push({Piso:fr.p.nombre,Casilla:c,Concepto:t,Valor:v}));rows.push({});});

<script>
// ════════════════════════════════════════════════════════════════════
//  GESTORÍA 2.0 — asistente de renta en 3 pasos
//  1 Año y pisos · 2 Revisar piso a piso (intereses incluidos) · 3 Enviar
// ════════════════════════════════════════════════════════════════════
window._g2=window._g2||{paso:1,abierto:null};
function anioRenta(){return _gAnio||ANIO_ACTUAL-1;}
// Periodo del piso dentro del año: del primer al último mes con ingresos en la caja
function periodoAuto(p,y){
  const hasta=y===ANIO_ACTUAL?MES_ACTUAL:12;let a=null,b=null;
  for(let m=1;m<=hasta;m++){const bl=cajaMes(y,m).find(x=>x.key===String(p.id));if(bl&&sumL(bl.ing)>0){if(a==null)a=m;b=m;}}
  if(a==null)return null;
  return{desde:y+'-'+String(a).padStart(2,'0'),hasta:y+'-'+String(b).padStart(2,'0')};
}
function prepararAnio(y,forzar){
  _gAnio=y;
  propsReales().forEach(p=>{
    const s=_gSeleccion[p.nombre];
    if(forzar||!s||!s.desde||!s.desde.startsWith(String(y))||!s.hasta.startsWith(String(y))){
      const per=periodoAuto(p,y);
      _gSeleccion[p.nombre]={incluir:per?(s?s.incluir!==false:true):false,desde:per?per.desde:y+'-01',hasta:per?per.hasta:y+'-12',sinIngresos:!per};
    }
    _gSeleccion[p.nombre].pid=p.id;
    if(!_gGastosSel[p.nombre]){_gGastosSel[p.nombre]={};gestoriaCategoriasProp(p,_gSeleccion[p.nombre]).forEach(cat=>{_gGastosSel[p.nombre][cat]=!CATS_SUMINISTRO.includes(cat);});}
  });
}
function pisosRenta(){return propsReales().filter(p=>_gSeleccion[p.nombre]&&_gSeleccion[p.nombre].incluir&&pctF(p)>0);}
function tieneHipoteca(p,sel){
  const f=fiscal(p),inv=_extra.inversion[String(p.id)]||{};
  if(f.banco||+inv.cuota>0||tienePrestamo(inv))return true;
  return mesesRango(sel.desde,sel.hasta).some(([y,m])=>{const b=cajaMes(y,m).find(x=>x.key===String(p.id));return b&&b.gas.some(l=>RE_HIPO.test(l.c||''));});
}
function interesesAnioPiso(p,y){const f=fiscal(p);const v=f.intereses&&f.intereses[y];return v===''||v==null?null:+v;}

// Los intereses del certificado sustituyen SIEMPRE a cualquier línea de hipoteca (aunque no esté apuntada en la caja)
const _gestoriaGastosPropV1=gestoriaGastosProp;
gestoriaGastosProp=function(p,sel,gs){
  const r=_gestoriaGastosPropV1(p,sel,gs);
  const [dy]=sel.desde.split('-').map(Number),[hy]=sel.hasta.split('-').map(Number);
  if(dy!==hy)return r;
  const v=interesesAnioPiso(p,dy);if(v==null)return r;
  const f=fiscal(p),det=r.gastosDetalle.filter(g=>!g.hipo);
  det.unshift({concepto:'Intereses hipoteca'+(f.banco?' '+f.banco:''),clave:'__intereses',cat:'Intereses',total:r2(v),meses:1,importe:r2(v),intereses:true,cert:true,hipo:true,fijo:true});
  return{gastosDetalle:det,gasTotal:det.reduce((a,g)=>a+(+g.total||0),0)};
};

// Comprobaciones antes de enviar
function revisarPiso(p){
  const sel=_gSeleccion[p.nombre],f=fiscal(p),y=anioRenta(),fr=fichaRenta(p),out=[];
  const add=(ok,nivel,txt,acc)=>out.push({ok,nivel,txt,acc});
  add(!!f.ref,'err','Referencia catastral',`modalFiscal(${p.id})`);
  add(!!f.nifs,'err','NIF del inquilino',`modalFiscal(${p.id})`);
  add(!!f.fechaContrato,'warn','Fecha del contrato',`modalFiscal(${p.id})`);
  add(fr.ing>0,'err','Ingresos del año',`irA('resumen')`);
  if(tieneHipoteca(p,sel)){
    const v=interesesAnioPiso(p,y);
    if(v!=null)add(true,'ok','Intereses de la hipoteca ('+fmtDec(v)+' €)','');
    else if(tienePrestamo(_extra.inversion[String(p.id)]||{}))add(false,'warn','Intereses: solo estimados, falta el certificado','focusInt('+p.id+')');
    else add(false,'err','Intereses de la hipoteca','focusInt('+p.id+')');
  }
  add(fr.amort>0,'err','Amortización (compra y valores catastrales)',`modalFiscal(${p.id})`);
  return out;
}
function estadoRevision(p){const r=revisarPiso(p),e=r.filter(x=>!x.ok&&x.nivel==='err').length,w=r.filter(x=>!x.ok&&x.nivel==='warn').length;return{r,e,w};}
function focusInt(pid){window._g2.paso=2;window._g2.abierto=pid;renderSection('gestoria');setTimeout(()=>{const el=document.getElementById('int-'+pid);if(el){el.scrollIntoView({block:'center'});el.focus();}},120);}

renderGestoria=function(c){
  const y=anioRenta();prepararAnio(y,false);
  const paso=window._g2.paso,pisos=pisosRenta();
  const st=['Año y pisos','Revisar','Enviar'];
  const head=`<div class="nv-step">${st.map((t,i)=>{const n=i+1,s=n<paso?'done':n===paso?'on':'';return`<div class="nv-step-i ${s}" ${n<paso?`onclick="window._g2.paso=${n};renderSection('gestoria')" style="cursor:pointer"`:''}><span>${n<paso?'✓':n}</span><small>${t}</small></div>${i<2?`<i class="${n<paso?'done':''}"></i>`:''}`;}).join('')}</div>`;
  let body='';
  if(paso===1){
    const a0=Math.min(ANIO_ACTUAL-2,...Object.values(INICIO_PROP||{}).map(x=>+x.anio||ANIO_ACTUAL)),anios=[];for(let a=ANIO_ACTUAL;a>=a0;a--)anios.push(a);
    body=`<div class="nv-hero" style="padding:1rem 1.1rem;"><div class="lbl">Declaración de la renta</div><div style="font-size:1.15rem;font-weight:800;margin:.15rem 0;">¿De qué año es la renta?</div><div class="row"><span>La renta de ${ANIO_ACTUAL-1} se presenta entre abril y junio de ${ANIO_ACTUAL}.</span></div></div>
    <div class="nv-menu-h" style="margin-top:.2rem;">¿De quién es la renta?</div>
    <div class="nv-seg"><button class="${declPareja()?'':'on'}" onclick="_extra.ajustes.decl='yo';saveData();renderSection('gestoria')">👤 Jose (yo)</button><button class="${declPareja()?'on':''}" onclick="_extra.ajustes.decl='pareja';saveData();renderSection('gestoria')">👤 ${esc(cotitular().nombre.split(' ')[0])}</button></div>
    ${declPareja()?`<div class="nv-note">Se calcula con el % de ${esc(cotitular().nombre.split(' ')[0])} en cada piso, a partir de tus datos (ingresos, gastos, intereses, compra y catastro). <a href="#" onclick="event.preventDefault();modalCotitular()" style="color:var(--pri);font-weight:800;">Nombre y NIF</a></div>`:''}
    <div class="nv-menu-h">Año</div>
    <select class="nv-in" style="font-weight:800;margin-bottom:.9rem;" onchange="prepararAnio(+this.value,true);renderSection('gestoria')">${anios.map(a=>`<option value="${a}" ${a===y?'selected':''}>Renta ${a}${a===ANIO_ACTUAL?' (año en curso)':a===ANIO_ACTUAL-1?' (se presenta este año)':''}</option>`).join('')}</select>
    <div class="nv-menu-h">Pisos alquilados en ${y}</div>
    <div class="nv-menu">${propsReales().map(p=>{const s=_gSeleccion[p.nombre];
      if(pctF(p)<=0)return`<div class="nv-menu-row" style="cursor:default;opacity:.55;"><span style="width:20px"></span><span class="tx"><b>${esc(p.nombre)}</b><small>${esc(cotitular().nombre.split(' ')[0])} no es propietaria · <a href="#" onclick="event.preventDefault();modalFiscal(${p.id})">cambiar %</a></small></span></div>`;
      const fr=s.incluir?fichaRenta(p):null;
      return`<div class="nv-menu-row" style="cursor:default;align-items:flex-start;">
        <input type="checkbox" ${s.incluir?'checked':''} style="width:20px;height:20px;accent-color:var(--pri);margin-top:.5rem;" onchange="_gSeleccion['${escJs(p.nombre)}'].incluir=this.checked;renderSection('gestoria')"/>
        <span class="tx"><b>${esc(p.nombre)}</b>
        ${s.incluir?`<small style="display:flex;gap:.3rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;">
          <input type="month" value="${s.desde}" style="font-size:.75rem;border:1px solid var(--line);border-radius:7px;padding:.15rem .3rem;" onchange="setMesG('${escJs(p.nombre)}','desde',this.value)"/> a
          <input type="month" value="${s.hasta}" style="font-size:.75rem;border:1px solid var(--line);border-radius:7px;padding:.15rem .3rem;" onchange="setMesG('${escJs(p.nombre)}','hasta',this.value)"/></small>
          <small style="margin-top:.25rem;">${fr.dias} días alquilado${diasParados(p.id,s)?` <span style="color:var(--warn);font-weight:700;">(${diasParados(p.id,s)} parado)</span>`:''} · ingresos ${eur(fr.ing)} · ${declPareja()?'su':'tu'} ${pctF(p)} %</small>
          <button class="btn btn-secondary btn-sm" style="margin-top:.4rem;align-self:flex-start;" onclick="modalDias(${p.id})">📅 Modificar días</button>`:`<small>${s.sinIngresos?'Sin ingresos en '+y+' en la caja':'No se incluye'}</small>`}</span></div>`;}).join('')}</div>
    <div class="nv-note" style="margin-top:.7rem;">Los meses se rellenan solos con los meses que tienen ingresos en la caja. Cámbialos si el contrato empezó o acabó otro mes.</div>

async function compartirRenta(){
  const y=anioRenta(),nombre='Renta_'+y+'_alquileres.xlsx';
  try{showToast('⏳ Preparando…');await cargarSheetJS();}catch(e){alert('Sin conexión para generar el Excel. Prueba con el PDF.');return;}
  const wb=libroRenta(),buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const file=new File([buf],nombre,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function _zip(files){ // [{name,data:Uint8Array}] sin compresión

  files.forEach(f=>{const nm=enc.encode(f.name),crc=_crc32(f.data),h=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0);w32(h,crc);w32(h,f.data.length);w32(h,f.data.length);w16(h,nm.length);w16(h,0);
    parts.push(new Uint8Array(h),nm,f.data);
    const c=[];w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x0800);w16(c,0);w16(c,0);w16(c,0);w32(c,crc);w32(c,f.data.length);w32(c,f.data.length);w16(c,nm.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    cen.push(new Uint8Array(c),nm);off+=h.length+nm.length+f.data.length;});

}

<script>
// ════════════════════════════════════════════════════════════════════
//  DOCUMENTOS: verlos bien en el móvil y rellenar datos al subirlos
//  (nota simple, catastro, contrato de alquiler)
// ════════════════════════════════════════════════════════════════════
const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
function cargarScript(src,glob){return new Promise((ok,ko)=>{if(window[glob])return ok(window[glob]);const s=document.createElement('script');s.src=src;s.onload=()=>window[glob]?ok(window[glob]):ko(new Error('no carga '+glob));s.onerror=()=>ko(new Error('sin conexión'));document.head.appendChild(s);});}
async function pdfjs(){const l=await cargarScript(PDFJS_URL,'pdfjsLib');l.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;return l;}
function dataABytes(data){const b=atob(String(data).split(',')[1]||'');const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function dataABlob(data){const m=/^data:([^;]+)/.exec(data);return new Blob([dataABytes(data)],{type:m?m[1]:'application/octet-stream'});}
function esPDF(doc){return /^data:application\/pdf/.test(doc&&doc.data||'');}
function esImg(doc){return /^data:image\//.test(doc&&doc.data||'');}

// ── Visor dentro de la app (funciona en iPhone, también como app instalada) ──
function verDoc(doc){
  if(!doc||(!doc.data&&!doc.paginas)){alert('Este documento está vacío. Vuelve a subirlo.');return;}
  window._docVisto=doc;
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button><div class="modal-title" style="padding-right:2rem;word-break:break-word;">${esc(doc.nombre||'Documento')}</div>
  <div style="display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap;">
    ${doc.data?`<button class="btn btn-secondary btn-sm" onclick="abrirDocFuera()">↗ Abrir aparte</button>`:''}
    <button class="btn btn-secondary btn-sm" onclick="compartirDoc()">📤 Guardar / compartir</button>
  </div>
  <div id="visor" style="background:#f1f5f9;border-radius:12px;padding:.4rem;max-height:65vh;overflow:auto;-webkit-overflow-scrolling:touch;"><div class="nv-s" style="padding:1rem;text-align:center;">Cargando…</div></div>`);
  pintarVisor(doc);
}
async function pintarVisor(doc){
  const v=document.getElementById('visor');if(!v)return;
  if(doc.paginas&&doc.paginas.length){v.innerHTML=doc.paginas.map(src=>`<img src="${src}" style="width:100%;display:block;margin-bottom:.4rem;border-radius:6px;background:#fff;"/>`).join('');return;}
  if(esImg(doc)){v.innerHTML=`<img src="${doc.data}" style="width:100%;display:block;border-radius:6px;"/>`;return;}
  if(esPDF(doc)){
    try{
      const lib=await pdfjs(),pdf=await lib.getDocument({data:dataABytes(doc.data)}).promise;v.innerHTML='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){
        const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1}),sc=Math.min(2,(v.clientWidth*2||800)/vp0.width),vp=pg.getViewport({scale:sc});
        const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;cv.style.cssText='width:100%;display:block;margin-bottom:.4rem;border-radius:6px;background:#fff;';
        v.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      }
      if(pdf.numPages>30)v.insertAdjacentHTML('beforeend','<div class="nv-s" style="padding:.5rem;">Solo se muestran las 30 primeras páginas. Usa "Abrir aparte" para verlo entero.</div>');
    }catch(e){v.innerHTML=`<iframe src="${URL.createObjectURL(dataABlob(doc.data))}" style="width:100%;height:60vh;border:0;background:#fff;"></iframe>`;}
    return;
  }
  v.innerHTML='<div class="nv-s" style="padding:1rem;">Este tipo de archivo no se puede ver aquí. Pulsa "Guardar / compartir" para abrirlo con otra app.</div>';
}
function abrirDocFuera(){const d=window._docVisto;if(!d||!d.data)return;const u=URL.createObjectURL(dataABlob(d.data));const w=window.open(u,'_blank');if(!w)location.href=u;}
async function compartirDoc(){
  const d=window._docVisto;if(!d)return;
  let blob,nombre=d.nombre||'documento';
  if(d.data)blob=dataABlob(d.data);
  else{blob=dataABlob(d.paginas[0]);nombre=nombre.replace(/\.\w+$/,'')+'.jpg';}
  const f=new File([blob],nombre,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nombre});return;}catch(e){if(e&&e.name==='AbortError')return;}}
