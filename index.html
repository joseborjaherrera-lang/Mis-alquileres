}
abrirArchivo=function(data,nombre){verDoc({data,nombre});};

// ── Subida: fotos comprimidas; PDF grande → páginas en JPG para que sincronice ──
const MAX_PDF=2.5*1024*1024;
async function prepararArchivo(file){
  if(/^image\//.test(file.type))return new Promise(ok=>leerArchivo(file,a=>ok(Object.assign(a,{fecha:new Date().toLocaleDateString('es-ES')}))));
  const data=await new Promise(ok=>{const fr=new FileReader();fr.onload=e=>ok(e.target.result);fr.readAsDataURL(file);});
  const base={nombre:file.name,fecha:new Date().toLocaleDateString('es-ES')};
  if(file.type==='application/pdf'&&file.size>MAX_PDF){
    try{
      showToast('⏳ Comprimiendo PDF…');
      const lib=await pdfjs(),pdf=await lib.getDocument({data:dataABytes(data)}).promise,pags=[];
      for(let i=1;i<=Math.min(pdf.numPages,20);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;pags.push(cv.toDataURL('image/jpeg',0.6));}
      return Object.assign(base,{data:'',paginas:pags,_pdf:data});
    }catch(e){alert('El PDF pesa '+(file.size/1048576).toFixed(1)+' MB y no se ha podido comprimir sin conexión. Prueba con uno más pequeño o con una foto.');return null;}
  }
  return Object.assign(base,{data});
}
subirDocProp=async function(propId,campo,input){
  const file=input.files[0];if(!file)return;const a=await prepararArchivo(file);if(!a)return;
  const p=propiedades.find(x=>x.id===propId);p.documentos=p.documentos||{};
  const src=a._pdf||a.data;delete a._pdf;p.documentos[campo]=a;saveData();window._dTab='documentos';renderDetalle(document.getElementById('main-content'));
  const tipo=campo==='notaSimpleDoc'?'nota':campo==='catastralDoc'?'catastro':null;
  if(tipo)setTimeout(()=>leerYRellenar(propId,tipo,src,a.paginas),300);
};
subirContrato=async function(propId,input){
  const file=input.files[0];if(!file)return;const a=await prepararArchivo(file);if(!a)return;
  const p=propiedades.find(x=>x.id===propId);const src=a._pdf||a.data;delete a._pdf;p.contratoPDF=a;saveData();renderDetalle(document.getElementById('main-content'));
  setTimeout(()=>leerYRellenar(propId,'contrato',src,a.paginas),300);
};
function docDe(p,tipo){return tipo==='contrato'?p.contratoPDF:(p.documentos||{})[tipo==='nota'?'notaSimpleDoc':'catastralDoc'];}
function releer(propId,tipo){const p=propiedades.find(x=>x.id===propId),d=docDe(p,tipo);if(!d){alert('Primero sube el documento');return;}leerYRellenar(propId,tipo,d.data,d.paginas,true);}

// ── Lectura del texto ──
async function textoPDF(data){
  const lib=await pdfjs(),pdf=await lib.getDocument({data:dataABytes(data)}).promise;let out='';
  for(let i=1;i<=Math.min(pdf.numPages,25);i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();let lastY=null,line='';
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>2){out+=line.trim()+'\n';line='';}line+=it.str+(it.hasEOL?' ':' ');lastY=y;});out+=line.trim()+'\n\n';}
  return out;
}
async function textoOCR(imgs){
  const T=await cargarScript(TESS_URL,'Tesseract');let out='';
  for(let i=0;i<imgs.length;i++){showToast('🔍 Leyendo página '+(i+1)+' de '+imgs.length+'…');const r=await T.recognize(imgs[i],'spa');out+=r.data.text+'\n\n';}
  return out;
}
async function leerYRellenar(propId,tipo,data,paginas,manual){
  const nombreTipo={nota:'la nota simple',catastro:'el documento de Catastro',contrato:'el contrato'}[tipo];
  let texto='';
  try{
    showToast('🔍 Leyendo '+nombreTipo+'…');
    if(data&&/^data:application\/pdf/.test(data))texto=await textoPDF(data);
    if(texto.replace(/\s/g,'').length<80){
      const imgs=paginas&&paginas.length?paginas:(data&&/^data:image/.test(data)?[data]:null);
      let lista=imgs;
      if(!lista&&data&&/^data:application\/pdf/.test(data)){ // PDF escaneado: pasar páginas a imagen
        const lib=await pdfjs(),pdf=await lib.getDocument({data:dataABytes(data)}).promise;lista=[];
        for(let i=1;i<=Math.min(pdf.numPages,6);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;lista.push(cv.toDataURL('image/jpeg',0.85));}
      }
      if(!lista){if(manual)alert('Este tipo de archivo no se puede leer. Sube un PDF o una foto.');return;}
      if(!confirm('Es un documento escaneado o una foto. Leerlo puede tardar unos 20-40 segundos.\n\n¿Lo leo para rellenar los datos?'))return;
      texto=await textoOCR(lista.slice(0,6));
    }
  }catch(e){if(manual||tipo)alert('No se ha podido leer '+nombreTipo+' ('+e.message+'). Hace falta conexión a internet la primera vez.');return;}
  const p=propiedades.find(x=>x.id===propId);
  const r=tipo==='nota'?parseNota(texto):tipo==='catastro'?parseCatastro(texto):parseContrato(texto);
  mostrarDetectados(p,tipo,r,texto);
}

// ── Análisis del texto ──
function normT(t){return String(t||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ \t]+/g,' ');}
function numES(s){if(s==null)return null;s=String(s).trim().replace(/\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return s!==''&&isFinite(+s)?Math.round(+s*10000)/10000:null;}
const MESES_ES={ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
function fechaISO(d,m,y){d=+d;m=isNaN(+m)?MESES_ES[m]:+m;y=+y;if(y<100)y+=2000;if(!d||!m||!y||m>12||d>31)return null;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function buscarFecha(s){
  let m=/\b(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})\b/.exec(s);if(m)return fechaISO(m[1],m[2],m[3]);
  m=/\b(\d{1,2})\s+DE\s+(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|SETIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)\s+(?:DE|DEL)\s+(\d{4})\b/.exec(s);if(m)return fechaISO(m[1],m[2],m[3]);
  return null;
}
function refCatastral(T){const m=/\b(\d{7}[A-Z]{2}\d{4}[A-Z]\d{4}[A-Z]{2})\b/.exec(T)||/(\d{7}[A-Z]{2}\d{4}[A-Z]\d{4}[A-Z]{2})/.exec(T.replace(/\s+/g,''));return m?m[1]:null;}
const RE_NIF=/\b([XYZ]-?\d{7}-?[A-Z]|\d{8}-?[A-Z])\b/g;
function misNIFs(){const s=new Set([(_extra.ajustes.minif||'30220216X').toUpperCase()]);const c=(cotitular().nif||'').toUpperCase();if(c)s.add(c);return s;}
function quienEs(nombre,nif){
  const n=normT(nombre),nf=(nif||'').toUpperCase().replace(/-/g,'');
  if(nf&&nf===(_extra.ajustes.minif||'30220216X').toUpperCase()||/BORJA\s+HERRERA/.test(n))return'yo';
  const c=cotitular();if(nf&&c.nif&&nf===c.nif.toUpperCase()||(c.nombre&&normT(c.nombre).split(' ').slice(1).filter(Boolean).every(w=>n.includes(w))))return'pareja';
  return null;
}
function parseCatastro(t){
  const T=normT(t),r={};
  r.ref=refCatastral(T);
  let m=/LOCALIZACION:?\s*([^\n]{6,120})/.exec(T);if(m)r.dir=m[1].replace(/\s+/g,' ').trim();
  m=/SUPERFICIE CONSTRUIDA[^\d\n]{0,25}([\d.]+(?:,\d+)?)\s*M/.exec(T);if(m)r.m2=numES(m[1]);
  m=/VALOR CATASTRAL (?:DE LA )?CONSTRUCCION[^\d\n]{0,30}([\d.]+,\d{2})/.exec(T);if(m)r.vccTotal=numES(m[1]);
  m=/VALOR CATASTRAL (?:DEL )?SUELO[^\d\n]{0,30}([\d.]+,\d{2})/.exec(T)||/VALOR SUELO[^\d\n]{0,20}([\d.]+,\d{2})/.exec(T);if(m)r.vcsTotal=numES(m[1]);
  const re=/VALOR CATASTRAL(?!\s*(?:DE LA |DEL )?(?:CONSTRUCCION|SUELO))[^\d\n]{0,30}([\d.]+,\d{2})/g;let x;while((x=re.exec(T))){const v=numES(x[1]);if(!r.vctTotal||v>r.vctTotal)r.vctTotal=v;}
  if(!r.vctTotal&&r.vccTotal&&r.vcsTotal)r.vctTotal=Math.round((r.vccTotal+r.vcsTotal)*100)/100;
  m=/(\d{1,3}(?:,\d+)?)\s*%\s*(?:DE\s*)?(?:PROPIEDAD|PLENO DOMINIO)/.exec(T);if(m)r.pctYo=numES(m[1]);
  m=/ANO VALOR:?\s*(\d{4})|VALOR CATASTRAL\s*\(?(\d{4})\)?/.exec(T);if(m)r.anioValor=+(m[1]||m[2]);
  return r;
}
function parseNota(t){
  const T=normT(t),r={};
  r.ref=refCatastral(T);
  let m=/SUPERFICIE CONSTRUIDA[^\d\n]{0,40}([\d.]+(?:,\d+)?)\s*(?:M|METROS)/.exec(T);if(m)r.m2=numES(m[1]);
  // Titulares: nombre + NIF + porcentaje
  r.titulares=[];const re=/([A-ZÑ][A-ZÑ ,.]{5,80}?)[, ]+(?:CON )?(?:N\.?I\.?F\.?|D\.?N\.?I\.?|N\.?I\.?E\.?)[:\s]*([XYZ]?-?\d{7,8}-?[A-Z])[\s\S]{0,260}?(\d{1,3}(?:,\d+)?)\s*%/g;let x;
  while((x=re.exec(T))){const nombre=x[1].replace(/^(?:DON|DONA|D\.|DNA\.?)\s+/,'').replace(/[,.]+$/,'').trim(),nif=x[2].replace(/-/g,''),pct=numES(x[3]);if(!r.titulares.some(z=>z.nif===nif))r.titulares.push({nombre,nif,pct,quien:quienEs(nombre,nif)});}
  const yo=r.titulares.find(z=>z.quien==='yo'),pa=r.titulares.find(z=>z.quien==='pareja');
  if(yo)r.pctYo=yo.pct;if(pa)r.pctPareja=pa.pct;
  if(!yo&&!pa){m=/(\d{1,3}(?:,\d+)?)\s*%\s*(?:DEL\s*)?PLENO DOMINIO/.exec(T);if(m)r.pctYo=numES(m[1]);}
  m=/TITULO:?\s*(COMPRAVENTA|COMPRA|HERENCIA|DONACION|ADJUDICACION|EXTINCION DE CONDOMINIO|PERMUTA)/.exec(T);
  if(m)r.tipoAdq=/HERENCIA|DONACION/.test(m[1])?'Lucrativa':'Onerosa';
  m=/(?:FECHA(?: DE LA)? (?:ESCRITURA|DOCUMENTO|TITULO)|AUTORIZAD[AO][^\n]{0,60}?(?:EL DIA|EL|CON FECHA)|ESCRITURA[^\n]{0,80}?(?:DE FECHA|EL DIA|FECHA))[:\s]*([^\n]{0,40})/.exec(T);
  if(m)r.fechaAdq=buscarFecha(m[1]);
  if(!r.fechaAdq){m=/TITULO[\s\S]{0,300}?/.exec(T);if(m)r.fechaAdq=buscarFecha(m[0]);}
  // Hipoteca
  const iH=T.search(/\bHIPOTECA\b/);
  if(iH>=0){const H=T.slice(iH,iH+1600);r.hipoteca=true;
    m=/A FAVOR (?:DE|DEL)\s*(?:LA ENTIDAD\s*)?(?:"|')?([A-Z][A-Z0-9 .&-]{2,60}?)(?:"|')?(?:,|\s+S\.?A|\s+CON|\s+POR|\s+EN GARANTIA|\n)/.exec(H);
    if(m){const b=m[1].trim();r.banco=/ING/.test(b)?'ING':/SANTANDER/.test(b)?'Santander':/BBVA|BILBAO/.test(b)?'BBVA':/CAIXA|CAIXABANK/.test(b)?'CaixaBank':/SABADELL/.test(b)?'Sabadell':/UNICAJA/.test(b)?'Unicaja':/BANKINTER/.test(b)?'Bankinter':/CAJA RURAL|CAJASUR|KUTXA/.test(b)?b.replace(/\s+/g,' '):b.split(' ').slice(0,3).join(' ');}
    m=/(?:CAPITAL|PRINCIPAL|PRESTAMO)[^\d\n]{0,60}?([\d.]+,\d{2})\s*(?:EUROS|€)/.exec(H);if(m)r.prestamo=numES(m[1]);
    m=/PLAZO[^\d\n]{0,40}?(\d{1,3})\s*(ANOS|MESES)/.exec(H);if(m)r.plazo=m[2]==='MESES'?Math.round(+m[1]/12):+m[1];
    m=/INTERES[^\d\n]{0,80}?(\d{1,2}(?:,\d{1,4})?)\s*%/.exec(H);if(m)r.tipo=numES(m[1]);
  }
  return r;
}
function parseContrato(t){
  const T=normT(t),r={};
  r.ref=refCatastral(T);
  const mios=misNIFs(),nifs=[];let x;
  // NIF del inquilino: primero en la parte del arrendatario; si no, cualquiera que no sea tuyo ni de tu pareja
  const iA=T.search(/DE OTRA PARTE|Y DE LA OTRA|ARRENDATARI[OA]S?\s*:/),zona=iA>=0?T.slice(iA,iA+500):'';
  const coger=(txt)=>{const re=new RegExp(RE_NIF.source,'g');while((x=re.exec(txt))){const n=x[1].replace(/-/g,'');if(!mios.has(n)&&!nifs.includes(n))nifs.push(n);}};
  coger(zona);if(!nifs.length)coger(T);
  const pas=/PASAPORTE[^A-Z0-9\n]{0,15}([A-Z0-9]{6,12})/.exec(T);if(pas&&!nifs.includes(pas[1]))nifs.push(pas[1]),r.extranjero=true;
  if(nifs.length)r.nifs=nifs.join(', ');
  let m=/(?:DE OTRA PARTE|ARRENDATARI[OA]S?\s*:)[,:\s]*(?:D\.?|DON|DONA|DNA\.?|D\.?ª)?\s*([A-ZÑ][A-ZÑ ]{4,60}?)(?:,|\s+MAYOR|\s+CON\s+(?:DNI|NIE|N\.I|PASAPORTE)|\s+PROVIST|\s+DE NACIONALIDAD)/.exec(T);
  if(m)r.inquilino=m[1].replace(/\s+/g,' ').trim();
  m=/\bEN\s+[A-Z ]{3,30},\s*A\s+(\d{1,2})\s+DE\s+([A-Z]+)\s+DE\s+(\d{4})/.exec(T);if(m)r.fechaContrato=fechaISO(m[1],m[2],m[3]);
  if(!r.fechaContrato){m=/(?:FECHA DE INICIO|COMIENZA|ENTRARA EN VIGOR|A PARTIR DEL? DIA)[^\n]{0,40}/.exec(T);if(m)r.fechaContrato=buscarFecha(m[0]);}
  if(!r.fechaContrato)r.fechaContrato=buscarFecha(T.slice(0,1500));
  m=/MENSUALIDADES DE\s*([\d.]+(?:,\d{2})?)\s*(?:€|EUROS)/.exec(T)||/([\d.]+(?:,\d{2})?)\s*(?:€|EUROS)\s*(?:AL MES|MENSUALES|POR MES|CADA MES)/.exec(T)||/RENTA MENSUAL[\s\S]{0,80}?([\d.]+(?:,\d{2})?)\s*(?:€|EUROS)/.exec(T)||/RENTA[\s\S]{0,160}?([\d.]+(?:,\d{2})?)\s*(?:€|EUROS)/.exec(T);
  if(m)r.renta=numES(m[1]);
  m=/FIANZA[\s\S]{0,200}?([\d.]+(?:,\d{2})?)\s*(?:€|EUROS)/.exec(T);if(m)r.fianza=numES(m[1]);
  const NUM={UN:1,UNO:1,DOS:2,TRES:3,CUATRO:4,CINCO:5,SEIS:6,SIETE:7,ONCE:11,DOCE:12};
  m=/(?:DURACION|PLAZO)[\s\S]{0,120}?\b(\d{1,2}|UN|UNO|DOS|TRES|CUATRO|CINCO|SEIS|SIETE|ONCE|DOCE)\s*\(?\d*\)?\s*(ANOS?|MESES)/.exec(T);
  if(m){const n=NUM[m[1]]||+m[1];r.duracion=n+' '+(m[2].startsWith('MES')?'meses':(n===1?'año':'años'));}
  return r;
}

// ── Pantalla de confirmación ──
function mostrarDetectados(p,tipo,r,texto){
  const fz=fiscalBase(p),pct=r.pctYo||+fz.pct||50,campos=[];
  const add=(k,label,val,destino,fmtV)=>{if(val==null||val===''||(typeof val==='number'&&!isFinite(val)))return;campos.push({k,label,val,destino,fmtV});};
  add('ref','Referencia catastral',r.ref,'Datos de renta y Docs');
  add('dir','Dirección',r.dir,'Datos de renta');
  add('m2','Superficie construida (m²)',r.m2,'Datos de renta y Docs');
  add('pctYo','Tu % de propiedad',r.pctYo,'Datos de renta');
  add('pctPareja','% de '+cotitular().nombre.split(' ')[0],r.pctPareja,'Datos de renta');
  if(r.vctTotal)add('vct','Valor catastral (tu parte, '+pct+' %)',r2(r.vctTotal*pct/100),'Datos de renta');
  if(r.vccTotal)add('vcc','Valor catastral construcción (tu parte)',r2(r.vccTotal*pct/100),'Datos de renta');
  add('tipoAdq','Tipo de adquisición',r.tipoAdq,'Datos de renta');
  add('fechaAdq','Fecha de adquisición',r.fechaAdq,'Datos de renta');
  add('banco','Banco de la hipoteca',r.banco,'Hipoteca del piso');
  add('prestamo','Préstamo inicial (€)',r.prestamo,'Compra e hipoteca');
  add('tipo','Interés (%)',r.tipo,'Compra e hipoteca');
  add('plazo','Plazo (años)',r.plazo,'Compra e hipoteca');
  add('nifs','NIF del inquilino',r.nifs,'Datos de renta');
  add('fechaContrato','Fecha del contrato',r.fechaContrato,'Datos de renta');
  add('inquilino','Inquilino',r.inquilino,'Solo informativo');
  add('renta','Renta mensual (€)',r.renta,'Solo informativo');
  add('fianza','Fianza (€)',r.fianza,'Solo informativo');
  add('duracion','Duración',r.duracion,'Solo informativo');
  window._det={pid:p.id,campos};
  const tit=(r.titulares||[]).length?`<div class="nv-note">Titulares encontrados: ${r.titulares.map(z=>esc(z.nombre)+' ('+z.pct+' %)').join(' · ')}</div>`:'';
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button><div class="modal-title">Datos encontrados</div>
  <div class="nv-s" style="margin:-.8rem 0 .9rem;">${esc(p.nombre)} · ${{nota:'Nota simple',catastro:'Catastro',contrato:'Contrato'}[tipo]}. Revisa y corrige antes de guardar.</div>
  ${tit}
  ${campos.length?campos.map((c,i)=>`<div class="nv-det ${c.destino==='Solo informativo'?'info':''}">
    ${c.destino==='Solo informativo'?'<span style="width:20px;text-align:center;">ℹ️</span>':`<input type="checkbox" id="det-c-${i}" checked/>`}
    <div style="flex:1;min-width:0;"><label class="nv-lbl" for="det-v-${i}" style="margin:0 0 .2rem;">${esc(c.label)} <span style="color:var(--ink-3);font-weight:500;">→ ${c.destino}</span></label>
    <input class="nv-in" id="det-v-${i}" value="${esc(c.val)}" ${c.destino==='Solo informativo'?'readonly':''} style="padding:.45rem .6rem;font-size:15px;"/></div></div>`).join('')
    :`<div class="nv-empty"><div>🤷</div>No he encontrado datos claros en este documento.<br><small>Puede que sea una foto borrosa o un formato distinto. Mételos a mano en ✏️ Datos.</small></div>`}
  <details style="margin-top:.6rem;"><summary class="nv-s" style="cursor:pointer;">Ver el texto leído</summary><pre style="white-space:pre-wrap;font-size:.65rem;max-height:200px;overflow:auto;background:#f6f8f7;padding:.5rem;border-radius:8px;">${esc(String(texto).slice(0,6000))}</pre></details>
  <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>${campos.some(c=>c.destino!=='Solo informativo')?`<button class="btn btn-primary" onclick="aplicarDetectados()">Guardar marcados</button>`:''}</div>`);
}
function aplicarDetectados(){
  const {pid,campos}=window._det,p=propiedades.find(x=>x.id===pid);if(!p)return;
  _extra.fiscal=_extra.fiscal||{};const f=_extra.fiscal[String(pid)]=_extra.fiscal[String(pid)]||{};
  const inv=_extra.inversion[String(pid)]=_extra.inversion[String(pid)]||{};p.documentos=p.documentos||{};
  let n=0;
  campos.forEach((c,i)=>{
    const cb=document.getElementById('det-c-'+i);if(!cb||!cb.checked)return;
    let v=document.getElementById('det-v-'+i).value.trim();if(v==='')return;n++;
    const num=()=>numES(v);
    switch(c.k){
      case'ref':f.ref=v.toUpperCase().replace(/\s/g,'');p.documentos.catastralRef=f.ref;break;
      case'dir':f.dir=v;break;
      case'm2':f.m2=num();p.documentos.catastralSuperficie=num();break;
      case'pctYo':f.pct=num();break;
      case'pctPareja':f.pctPareja=num();break;
      case'vct':f.vct=num();break;
      case'vcc':f.vcc=num();break;
      case'tipoAdq':f.tipoAdq=/lucr|heren|don/i.test(v)?'Lucrativa':'Onerosa';break;
      case'fechaAdq':f.fechaAdq=v;break;
      case'banco':f.banco=v;break;
      case'prestamo':inv.prestamo=num();break;
      case'tipo':inv.tipo=num();break;
      case'plazo':inv.plazo=Math.round(num());break;
      case'nifs':f.nifs=v.toUpperCase();break;
      case'fechaContrato':f.fechaContrato=v;break;
    }
  });
  saveData();closeModal();showToast('✓ '+n+' dato'+(n===1?'':'s')+' guardado'+(n===1?'':'s'));
}
